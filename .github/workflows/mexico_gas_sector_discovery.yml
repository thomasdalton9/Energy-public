name: Mexico gas sector discovery

# Manual-only probe for Mexico gas sector sources
# (discovery_archive/americas/MEXICO_GAS_SECTOR_DISCOVERY.py).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pandas openpyxl
      - name: Run discovery
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p mx_raw
          timeout 2100 python3 discovery_archive/americas/MEXICO_GAS_SECTOR_DISCOVERY2.py 2>&1 | tee mx_raw/log.txt
      - name: Push raw files to a throwaway branch for offline inspection
        if: always()
        run: |
          [ -d mx_raw ] || exit 0
          mv mx_raw /tmp/mx_raw
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan mx-gas-discovery-raw
          git rm -rfq --cached . >/dev/null
          git clean -fdxq
          mv /tmp/mx_raw mx_raw
          git add mx_raw
          git commit -qm "Mexico gas sector discovery raw files (throwaway)"
          git push -f origin mx-gas-discovery-raw
