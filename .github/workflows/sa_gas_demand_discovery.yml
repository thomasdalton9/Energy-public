name: South America gas demand discovery

on:
  workflow_dispatch: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install --with-deps chromium
      - name: Run discovery
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 720 python3 south_america/SA_GAS_DEMAND_DISCOVERY.py
