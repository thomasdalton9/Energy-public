name: Israel NGA review probe

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install curl_cffi pdfplumber
      - run: python3 discovery_archive/middle_east/ISRAEL_NGA_REVIEW_PROBE.py
      - name: Push PDFs to a temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan tmp-nga-pdfs
          git rm -rfq --cached .
          git add -f probe_out
          git commit -qm "temporary: NGA review PDFs"
          git push -f origin tmp-nga-pdfs
