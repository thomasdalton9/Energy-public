name: Europe future gas infrastructure

# LNG regas terminals, pipelines / interconnectors, storage and upstream additions to 2030 (europe/future/EUROPE_GAS_INFRA.py).
# Raw data only: physical projects with a sourced capacity and date. Heavy files (GIE map PDFs, TYNDP workbook) are re-read
# only when Last-Modified / ETag / length change; the committed workbook is the history store.
# Manual only (owner, 29 Oct 2026: Europe future builds are not run on a schedule; was cron "17 3 1,15 * *").
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: europe-future-gas
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pip install pandas openpyxl requests matplotlib
      - name: Run pull
        env:
          PYTHONUNBUFFERED: "1"
          GIE_API_KEY: ${{ secrets.GIE_API_KEY }}
        run: |
          python3 europe/future/EUROPE_GAS_INFRA.py --out-dir "output/Data and Chart Outputs" --png-dir "output/PNG Charts" 2>&1 | tee /tmp/run.log
      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          python3 add_charts.py "output/Data and Chart Outputs/europe_future_gas_infrastructure.xlsx" || echo "chart step skipped"
          mkdir -p "output/Python Scripts"
          cp europe/future/EUROPE_GAS_INFRA.py add_charts.py xlsx_charts.py xlsx_notes.py "output/Python Scripts/" || true
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/europe_future_gas_infrastructure.xlsx" output/PNG\ Charts/europe_future_gas_infrastructure__*.png "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Europe future gas infrastructure: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
