name: Brazil gas post-2025 discovery

on:
  workflow_dispatch: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pandas pdfplumber
      - name: Run discovery
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 540 python3 south_america/BRAZIL_GAS_POST2025_DISCOVERY.py
