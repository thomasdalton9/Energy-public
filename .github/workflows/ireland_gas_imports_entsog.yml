name: Ireland gas imports (ENTSOG)

# Validation-only cross-check against GNI's own transparency data
# (ireland_gni_transparency.yml is the production source) - run by hand.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 1000 python3 europe/ireland_gas_imports_entsog.py --out "output/Data and Chart Outputs/ireland_gas_imports_entsog_daily.xlsx"

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f "output/Data and Chart Outputs/ireland_gas_imports_entsog_daily.xlsx" ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/ireland_gas_imports_entsog_daily.xlsx"
          git diff --cached --quiet || git commit -m "Ireland gas imports (ENTSOG): automated update"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
