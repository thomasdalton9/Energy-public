name: EIA Waha price probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run probe
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: timeout 120 python3 discovery_archive/americas/EIA_WAHA_PRICE_PROBE.py
