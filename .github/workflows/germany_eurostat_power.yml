name: Europe power (Eurostat - DE IT PL BG RO)

# Germany, Italy, Poland, Bulgaria, Romania monthly net generation (and, except Germany, consumption) by source (Eurostat nrg_cb_pem, Destatis data) - europe/EUROSTAT_POWER_MONTHLY.py.
# Eurostat keeps the full history, so it runs on the 1st and 15th; the committed workbook is the history store.
on:
  schedule:
    - cron: "50 4 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: germany-eurostat-power
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl requests

      - name: Pull Eurostat
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 europe/EUROSTAT_POWER_MONTHLY.py --out-dir "output/Data and Chart Outputs"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          for c in germany italy poland bulgaria romania; do
            python3 add_charts.py "output/Data and Chart Outputs/${c}_eurostat_power_daily.xlsx" || echo "chart step failed: $c"
          done
          mkdir -p "output/Python Scripts"
          cp europe/EUROSTAT_POWER_MONTHLY.py europe/daily_shape.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated workbook
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for c in germany italy poland bulgaria romania; do git add -f "output/Data and Chart Outputs/${c}_eurostat_power_daily.xlsx" || true; done
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Europe power (Eurostat DE IT PL BG RO): automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
