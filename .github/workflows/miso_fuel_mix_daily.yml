name: MISO fuel mix daily

# MISO's daily real-time generation fuel mix report (<YYYYMMDD>_sr_gfm.xlsx)
# is published the morning after each market day; one run in the US
# afternoon picks it up. The script fetches only the days published since
# the last saved one (see MISO_FUEL_MIX_DAILY.py).
on:
  schedule:
    - cron: "35 16 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl requests

      - name: Run MISO fuel mix pull
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 600 python3 americas/MISO_FUEL_MIX_DAILY.py --out "output/Data and Chart Outputs/miso_fuel_mix_daily.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/miso_fuel_mix_daily.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/miso_fuel_mix_daily.xlsx" || echo "chart step skipped/failed for miso_fuel_mix_daily.xlsx"
          mkdir -p "output/Python Scripts"
          cp americas/MISO_FUEL_MIX_DAILY.py americas/MISO_FUEL_MIX_2026_GAP_BACKFILL.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/miso_fuel_mix_daily.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "MISO fuel mix daily: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
