name: MISO fuel mix daily

# Twice a day, at 03:45 and 04:45 UTC - late enough in the Eastern day
# (22:45/23:45 EST or 23:45/00:45 EDT, depending on time of year) that
# MISO_FUEL_MIX_DAILY.py's script docstring explains why: /FuelMix/
# Today (used instead of /Yesterday, which turned out to not reliably
# be a real prior day) only ever shows the current, still-in-progress
# day, so this needs to run close to Eastern midnight for that day's
# interval coverage to pass the script's completeness threshold. Two
# fixed UTC times bracket both DST regimes: whichever one lands late
# in the correct Eastern day captures it with near-full coverage; the
# other either also succeeds (harmless, same day refined) or lands
# just after midnight with ~0 intervals and is safely skipped by the
# script's own coverage check - never a wasted or harmful run either
# way.
on:
  schedule:
    - cron: "45 3 * * *"
    - cron: "45 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl requests

      - name: Run MISO fuel mix pull
        run: python3 americas/MISO_FUEL_MIX_DAILY.py --out "output/Data and Chart Outputs/miso_fuel_mix_daily.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/miso_fuel_mix_daily.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/miso_fuel_mix_daily.xlsx" || echo "chart step skipped/failed for miso_fuel_mix_daily.xlsx"
          mkdir -p "output/Python Scripts"
          cp americas/MISO_FUEL_MIX_DAILY.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/miso_fuel_mix_daily.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "MISO fuel mix daily: automated update"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
