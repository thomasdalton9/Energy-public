name: MISO fuel mix daily

# Once a day at 09:00 UTC - comfortably after MISO's Eastern-time
# midnight rollover (05:00 UTC in EST, 04:00 UTC in EDT), so the
# /FuelMix/Yesterday endpoint has settled on the just-completed
# operating day rather than still being mid-rollover. Pulls that
# day's 5-minute generation-by-fuel-type readings and upserts the
# daily mean into americas/miso_fuel_mix_daily.xlsx.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl requests

      - name: Run MISO fuel mix pull
        run: python3 americas/MISO_FUEL_MIX_DAILY.py --out americas/miso_fuel_mix_daily.xlsx

      - name: Commit updated archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f americas/miso_fuel_mix_daily.xlsx
          git diff --cached --quiet || git commit -m "MISO fuel mix daily: automated update"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
