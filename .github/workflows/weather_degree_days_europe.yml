name: Weather degree days Europe

# Template for the other regions: copy this file, change REGION (and the workbook name) - weather/regions.json holds the cities.
# NASA POWER daily T2M for the region's cities (incremental: every city from its last stored day minus 10 days; the first run
# backfills 1991 onward and, if it runs out of time budget, the next run continues), population-weighted degree days per country
# (base 18 C and the Eurostat definition), 1991-2020 normals, anomalies, native charts. 1st/15th, before the weather master's
# evening rebuild (21:58 UTC).
# Manual only (owner, 29 Oct 2026: Europe pulls are not run on a schedule; was cron 47 1 1,15 * *).
on:
  workflow_dispatch:
    inputs:
      budget_min:
        description: "Minutes before no new city request is started (the next run continues)"
        default: "120"

permissions:
  contents: write

env:
  REGION: europe

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl matplotlib
      - name: Pull and compute
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 weather/degree_days.py --region "$REGION" --budget-min "${{ github.event.inputs.budget_min || '120' }}"

      - name: Add Excel charts, PNG charts and copy scripts
        if: always()
        run: |
          W="output/Data and Chart Outputs/${REGION}_degree_days.xlsx"
          [ -f "$W" ] && python3 add_charts.py "$W" && python3 png_charts.py "$W" || echo "chart step skipped/failed"
          mkdir -p "output/Python Scripts"
          cp weather/degree_days.py weather/weather_charts.py weather/regions.json add_charts.py png_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/${REGION}_degree_days.xlsx" "output/Data and Chart Outputs/weather_stores/${REGION}" || true
          git add -f "output/PNG Charts" "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Weather degree days ${REGION}: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
