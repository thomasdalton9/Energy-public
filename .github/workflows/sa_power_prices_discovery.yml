name: SA power prices discovery

# Manual-only probe for the South America daily power price pull (see
# discovery_archive/south_america/SA_POWER_PRICES_DISCOVERY.py). Optional input
# 'only': space-separated probe names (brazil colombia peru argentina chile uruguay bolivia ecuador).
on:
  workflow_dispatch:
    inputs:
      only:
        description: "probes to run (blank = all)"
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install requests pandas openpyxl certifi
          sudo apt-get install -y -q mdbtools >/dev/null
      - name: Run probe
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 1000 python3 discovery_archive/south_america/SA_POWER_PRICES_DISCOVERY.py ${{ github.event.inputs.only }}
