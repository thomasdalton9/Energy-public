name: Bolivia gas exports discovery 2

on:
  workflow_dispatch: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pdfplumber pandas openpyxl xlrd certifi cryptography
      - name: Run discovery
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 780 python3 discovery_archive/south_america/BOLIVIA_GAS_EXPORTS_DISCOVERY2.py
