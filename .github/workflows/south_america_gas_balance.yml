name: South America gas balance

# Rebuilds south_america_gas_balance.xlsx from the country gas workbooks (no downloads) on the 1st and 15th,
# after that day's pulls and before the South America master (21:20).
on:
  schedule:
    - cron: "5 21 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -q pandas openpyxl
      - name: Run
        run: python3 south_america/SA_GAS_BALANCE.py --out "output/Data and Chart Outputs/south_america_gas_balance.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/south_america_gas_balance.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/south_america_gas_balance.xlsx" || echo "chart step skipped/failed"
          mkdir -p "output/Python Scripts"
          cp south_america/SA_GAS_BALANCE.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/south_america_gas_balance.xlsx" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/south_america_gas_balance.xlsx" "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "South America gas balance: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
