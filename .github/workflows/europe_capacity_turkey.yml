name: Europe capacity - Turkey (monthly)

# Monthly installed capacity for Turkey from EPDK's monthly Electricity Market Sector Reports (PDF), see europe/capacity/TURKEY_CAPACITY_MONTHLY.py.
# Manual only (owner, 29 Oct 2026: Europe pulls are not run on a schedule; was cron 47 5 1,15 * *).
on:
  workflow_dispatch:
    inputs:
      retry:
        description: "retry report months that failed before (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas openpyxl requests matplotlib pymupdf python-docx
      - name: Run pull
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          ARGS=""
          if [ "${{ inputs.retry }}" = "true" ]; then ARGS="--retry"; fi
          python3 europe/capacity/TURKEY_CAPACITY_MONTHLY.py $ARGS

      - name: Add Excel charts, PNGs and copy scripts
        if: always()
        run: |
          w="output/Data and Chart Outputs/turkey_power_capacity_monthly.xlsx"
          [ -f "$w" ] && python3 add_charts.py "$w" && python3 png_charts.py "$w" || echo "chart step skipped/failed for $w"
          mkdir -p "output/Python Scripts"
          cp europe/capacity/TURKEY_CAPACITY_MONTHLY.py png_charts.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated workbook
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/turkey_power_capacity_monthly.xlsx" || true
          git add -f "output/PNG Charts" || true
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Europe capacity (Turkey): automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
