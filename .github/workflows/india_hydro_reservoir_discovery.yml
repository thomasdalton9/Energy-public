name: India hydro reservoir discovery

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run probe
        run: timeout 300 python3 subcontinent/INDIA_HYDRO_RESERVOIR_DISCOVERY.py
