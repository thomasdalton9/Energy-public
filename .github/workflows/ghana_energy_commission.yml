name: Ghana annual generation and Akosombo/Bui levels (Energy Commission)

# Energy Commission annual Energy Statistics booklet: annual generation by type and monthly Akosombo / Bui lake levels. Downloaded only when a new booklet appears; 1st/15th.
on:
  schedule:
    - cron: "10 5 1,15 * *"
  workflow_dispatch: {}
  push:                      # TEMPORARY: branch test run only; remove before merging to main
    branches: [ghana-power]
    paths: [".github/workflows/ghana_energy_commission.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas openpyxl requests pymupdf pdfplumber
      - name: Run pull
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 3000 python3 africa/GHANA_ENERGY_COMMISSION.py --out "output/Data and Chart Outputs/ghana_energy_commission_power.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/ghana_energy_commission_power.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/ghana_energy_commission_power.xlsx" || echo "chart step skipped/failed for ghana_energy_commission_power.xlsx"
          mkdir -p "output/Python Scripts"
          cp africa/GHANA_ENERGY_COMMISSION.py  africa/ghana_charts.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f "output/Data and Chart Outputs/ghana_energy_commission_power.xlsx" ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/ghana_energy_commission_power.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Ghana Energy Commission statistics: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
# (verification run)
