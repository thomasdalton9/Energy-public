name: Peru gas

# MINEM monthly distribution report (gas demand by sector per concession) and
# fiscalised production by lot, Perupetro LNG cargoes, COES power cross-check.
# MINEM publishes ~4 weeks after month end; weekly run on Wednesdays 13:17 UTC.
on:
  schedule:
    - cron: "17 13 * * 3"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl certifi
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 600 python3 south_america/PERU_GAS.py --out "output/Data and Chart Outputs/peru_gas_demand_by_sector.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/peru_gas_demand_by_sector.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/peru_gas_demand_by_sector.xlsx" || echo "chart step skipped/failed for peru_gas_demand_by_sector.xlsx"
          mkdir -p "output/Python Scripts"
          cp south_america/PERU_GAS.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f "output/Data and Chart Outputs/peru_gas_demand_by_sector.xlsx" ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/peru_gas_demand_by_sector.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Peru gas: automated update"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X theirs && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
