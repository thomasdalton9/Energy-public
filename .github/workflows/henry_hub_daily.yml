name: Henry Hub daily

# Once a day at 18:00 UTC (~2pm Eastern) - well after FRED/EIA typically
# publish the prior business day's Henry Hub spot price (usually posted
# by midday Eastern). A single request returns FRED's entire history
# each time (see the script docstring), so this run both keeps the
# archive current and, on its very first run, seeds the whole history
# back to 1997.
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl requests

      - name: Run Henry Hub pull
        run: timeout 120 python3 americas/HENRY_HUB_DAILY.py --out output/henry_hub_daily.xlsx

      - name: Commit updated archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/henry_hub_daily.xlsx
          git diff --cached --quiet || git commit -m "Henry Hub daily: automated update"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
