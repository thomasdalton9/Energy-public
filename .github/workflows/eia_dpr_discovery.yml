name: EIA DPR discovery

# One-off, manual: probe EIA's Drilling Productivity Report .xlsx
# (public, no key) ahead of building EIA_RIG_AND_BASIN_GAS_DAILY.py.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests openpyxl

      - name: Run discovery probe
        run: timeout 120 python3 americas/EIA_DPR_DISCOVERY.py
