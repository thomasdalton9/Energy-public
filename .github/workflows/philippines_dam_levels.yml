name: Philippines dam levels

# PAGASA posts only today's and yesterday's 08:00 dam levels (no history), so this runs DAILY.
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl xlrd
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          timeout 780 python3 asia/PHILIPPINES_PAGASA_DAMS.py || echo "asia/PHILIPPINES_PAGASA_DAMS.py failed"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/philippines_dam_levels.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/philippines_dam_levels.xlsx" || echo "chart step skipped/failed for philippines_dam_levels.xlsx"
          mkdir -p "output/Python Scripts"
          cp asia/PHILIPPINES_PAGASA_DAMS.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f "output/Data and Chart Outputs/philippines_dam_levels.xlsx" ] && git add -f "output/Data and Chart Outputs/philippines_dam_levels.xlsx" || true
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Philippines dam levels: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
