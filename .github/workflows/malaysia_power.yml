name: Malaysia power

# GSO (Grid System Operator) 10-minute generation by fuel, system demand and plant list, and
# Single Buyer system marginal prices. Backfills every missed day (GSO keeps history).
on:
  schedule:
    - cron: "10 3 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl xlrd
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          timeout 3480 python3 asia/MALAYSIA_GSO.py || echo "asia/MALAYSIA_GSO.py failed"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/malaysia_power_generation_daily.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/malaysia_power_generation_daily.xlsx" || echo "chart step skipped/failed for malaysia_power_generation_daily.xlsx"
          [ -f "output/Data and Chart Outputs/malaysia_power_capacity.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/malaysia_power_capacity.xlsx" || echo "chart step skipped/failed for malaysia_power_capacity.xlsx"
          [ -f "output/Data and Chart Outputs/malaysia_power_prices.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/malaysia_power_prices.xlsx" || echo "chart step skipped/failed for malaysia_power_prices.xlsx"
          mkdir -p "output/Python Scripts"
          cp asia/MALAYSIA_GSO.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f "output/Data and Chart Outputs/malaysia_power_generation_daily.xlsx" ] && git add -f "output/Data and Chart Outputs/malaysia_power_generation_daily.xlsx"
          [ -f "output/Data and Chart Outputs/malaysia_power_capacity.xlsx" ] && git add -f "output/Data and Chart Outputs/malaysia_power_capacity.xlsx"
          [ -f "output/Data and Chart Outputs/malaysia_power_prices.xlsx" ] && git add -f "output/Data and Chart Outputs/malaysia_power_prices.xlsx" || true
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Malaysia power: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
