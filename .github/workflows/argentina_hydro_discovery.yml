name: Argentina hydro discovery

on:
  workflow_dispatch:
    inputs:
      round:
        description: "probe round"
        default: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pandas openpyxl xlrd
      - name: Run probe
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 1300 python3 discovery_archive/south_america/ARGENTINA_HYDRO_DISCOVERY.py "${{ github.event.inputs.round || '1' }}"
