name: Gas TSO probe 9 (manual)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python3 discovery_archive/europe/GAS_TSO_PROBE9.py > probe9.log 2>&1; tail -c 60000 probe9.log
