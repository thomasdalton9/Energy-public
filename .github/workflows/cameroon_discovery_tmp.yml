name: Cameroon discovery
on:
  workflow_dispatch:
  push:
    branches: [cameroon-power]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pdfplumber
      - run: timeout 700 python3 discovery_archive/rest_of_world/CAMEROON_DISCOVERY.py
