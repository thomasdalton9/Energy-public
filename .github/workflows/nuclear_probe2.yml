name: Nuclear probe 2
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas openpyxl
      - name: Run probe
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: timeout 600 python3 discovery_archive/europe/nuclear/NUCLEAR_PROBE2.py
