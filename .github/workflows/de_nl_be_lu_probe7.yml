name: DE NL BE LU capacity probe 7 (manual)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests openpyxl
      - name: Run probe
        run: |
          mkdir -p discovery_archive/results/europe_capacity
          python3 -u discovery_archive/europe/capacity/DE_NL_BE_LU_CAPACITY_PROBE7.py 2>&1 | tee discovery_archive/results/europe_capacity/de_nl_be_lu_probe7.txt
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f discovery_archive/results/europe_capacity/
          git diff --cached --quiet || git commit -m "DE NL BE LU capacity probe 7 result"
          for i in 1 2 3 4 5; do { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0; sleep $((i*5)); done
