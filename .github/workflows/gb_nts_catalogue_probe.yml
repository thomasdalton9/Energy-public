name: GB NTS catalogue probe (manual)

on:
  workflow_dispatch:
    inputs:
      pat:
        description: regex on item names
        default: ''

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python3 -u discovery_archive/europe/GB_NTS_CATALOGUE_PROBE.py
        env:
          PAT: ${{ inputs.pat }}
