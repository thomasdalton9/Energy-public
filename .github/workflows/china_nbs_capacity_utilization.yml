name: China NBS capacity utilization quarterly

# Quarterly - NBS publishes capacity utilisation with the GDP release mid-Jan/Apr/Jul/Oct.
# Incremental: only releases not yet in the workbook are fetched (see the script's docstring).
on:
  schedule:
    - cron: "0 10 25 1,4,7,10 *"  # 25th of Jan/Apr/Jul/Oct - after the quarterly release
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl requests

      - name: Run China NBS capacity utilization quarterly pull
        run: timeout 2700 python3 asia/CHINA_NBS_CAPACITY_UTILIZATION.py --out "output/Data and Chart Outputs/china_nbs_capacity_utilization_quarterly.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/china_nbs_capacity_utilization_quarterly.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/china_nbs_capacity_utilization_quarterly.xlsx" || echo "chart step skipped/failed for china_nbs_capacity_utilization_quarterly.xlsx"
          mkdir -p "output/Python Scripts"
          cp asia/CHINA_NBS_CAPACITY_UTILIZATION.py asia/china_nbs_common.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f "output/Data and Chart Outputs/china_nbs_capacity_utilization_quarterly.xlsx" ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/china_nbs_capacity_utilization_quarterly.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "China NBS capacity utilization quarterly: automated update"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
