name: China NBS audit probe 1

# Manual, one-off: full NBS release list + sample releases (moved to discovery_archive/workflows after use).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas openpyxl
      - name: Probe
        run: timeout 1500 python3 discovery_archive/china/CHINA_NBS_AUDIT_PROBE1.py | tee discovery_archive/results/china_nbs_audit/probe1_log.txt
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f discovery_archive/results/china_nbs_audit
          git diff --cached --quiet || git commit -m "China NBS audit probe 1 results"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
