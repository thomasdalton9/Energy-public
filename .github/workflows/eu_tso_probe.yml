name: EU TSO power and gas probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run probe
        run: timeout 600 python3 discovery_archive/europe/EU_TSO_POWER_GAS_PROBE.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eu_tso_probe_report
          path: eu_tso_probe_report.json
