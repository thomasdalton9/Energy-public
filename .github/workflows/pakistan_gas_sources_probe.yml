name: Pakistan gas sources probe

on:
  workflow_dispatch:
    inputs:
      round:
        description: probe round
        default: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install requests pdfplumber pandas openpyxl xlrd playwright
          playwright install --with-deps chromium
      - name: Run probe
        run: timeout 2200 python3 discovery_archive/asia/PAKISTAN_GAS_SOURCES_PROBE.py "${{ github.event.inputs.round }}"
