name: Ireland smart grid

# Plain HTTP requests (no browser), and the API accepts wide date-range
# chunks - a full multi-year backfill completes in one run (unlike
# Mexico's CENACE, which needs a real browser per day). Daily schedule
# keeps it current after the initial backfill.
on:
  schedule:
    - cron: "15 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl requests

      # The script now checkpoints to disk every 10 chunks within each
      # chart type (not just once at the very end), so even if this
      # timeout fires mid-backfill the next run resumes from the last
      # checkpoint instead of losing everything - this is now headroom
      # for the (one-time) initial backfill, not a correctness requirement.
      - name: Run Ireland smart grid pull
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 1700 python3 europe/ireland_smartgrid.py --out "output/Data and Chart Outputs/ireland_smartgrid_15min.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/ireland_smartgrid_15min.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/ireland_smartgrid_15min.xlsx" || echo "chart step skipped/failed for ireland_smartgrid_15min.xlsx"
          mkdir -p "output/Python Scripts"
          cp europe/ireland_smartgrid.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f "output/Data and Chart Outputs/ireland_smartgrid_15min.xlsx" ] && git add -f "output/Data and Chart Outputs/ireland_smartgrid_15min.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Ireland smart grid: automated update"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
