name: Brazil gas

# MME republishes its historical gas balance annex with each monthly
# bulletin (a lag of a couple of months). The file always carries the
# full history, so each run just overwrites the archive. Weekly is plenty.
on:
  schedule:
    - cron: "15 11 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 300 python3 south_america/BRAZIL_GAS.py --out output/brazil_gas_monthly.xlsx

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f output/brazil_gas_monthly.xlsx ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/brazil_gas_monthly.xlsx
          git diff --cached --quiet || git commit -m "Brazil gas: automated update"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
