name: Brazil gas

# Weekly. Segments: MME's public national series is frozen at 2025-06 (annex
# xlsx); the PDF bulletins stopped at Sep-2025 and the replacement dashboard
# is login-gated, so the source-watch file flags any MME change ("SOURCE
# CHANGED" commit). Current data: ANP open data (pipeline movement by point,
# production, imports), pulled incrementally - only new, revised and the
# latest two months of pipeline files are fetched.
on:
  schedule:
    - cron: "15 11 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 1500 python3 south_america/BRAZIL_GAS.py --out "output/Data and Chart Outputs/brazil_gas_monthly.xlsx" --watch-out "output/Data and Chart Outputs/brazil_gas_source_watch.txt"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/brazil_gas_monthly.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/brazil_gas_monthly.xlsx" || echo "chart step skipped/failed for brazil_gas_monthly.xlsx"
          mkdir -p "output/Python Scripts"
          cp south_america/BRAZIL_GAS.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          watch="output/Data and Chart Outputs/brazil_gas_source_watch.txt"
          for f in "output/Data and Chart Outputs/brazil_gas_monthly.xlsx" "$watch"; do
            [ -f "$f" ] && git add -f "$f"
          done
          git add -f "output/Python Scripts" || true
          if git diff --cached -U0 -- "$watch" | grep -q '^[+-]MME'; then
            msg="Brazil gas: SOURCE CHANGED (MME) - see output/Data and Chart Outputs/brazil_gas_source_watch.txt"
          else
            msg="Brazil gas: automated update"
          fi
          git diff --cached --quiet || git commit -m "$msg"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
