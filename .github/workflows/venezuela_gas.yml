name: Venezuela gas

# JODI-Gas whole-file download (Venezuela submissions; FALLBACK - no raw sector source exists), fetched only when
# the file's Last-Modified changes. 1st and 15th.
on:
  schedule:
    - cron: "11 12 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 900 python3 south_america/VENEZUELA_GAS.py --out "output/Data and Chart Outputs/venezuela_gas.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/venezuela_gas.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/venezuela_gas.xlsx" || echo "chart step skipped/failed for venezuela_gas.xlsx"
          mkdir -p "output/Python Scripts"
          cp south_america/VENEZUELA_GAS.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f "output/Data and Chart Outputs/venezuela_gas.xlsx" ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/venezuela_gas.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Venezuela gas: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
