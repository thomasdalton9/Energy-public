name: MISO reachability discovery

# Manual, one-off: checks whether MISO's public real-time API
# (reported to be open, anonymous GET, no key/account required) is
# actually reachable and returns real data. See
# americas/MISO_REACHABILITY_DISCOVERY.py's docstring. Output is in
# the run log and uploaded as an artifact - nothing is committed.
on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run discovery
        run: python3 americas/MISO_REACHABILITY_DISCOVERY.py

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miso-reachability-discovery-output
          path: americas/miso_reachability_discovery_output.txt
          if-no-files-found: ignore
