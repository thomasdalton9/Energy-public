name: Europe TSO gas demand extra (PL, RO, HR, FI, ES early)

# National gas consumption from further operators' own series - Poland (Gaz-System), Finland (Gasgrid), Romania (Transgaz), Croatia (Plinacro),
# Spain 2021-22 (Enagas bulletin) - europe/GAS_TSO_SOUTHEAST_DAILY.py. All keep history, so it runs on the 1st and 15th;
# the committed workbook is the history store.
on:
  schedule:
    - cron: "30 3 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tso-gas-demand-extra
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl requests pdfplumber

      - name: Pull Poland (Gaz-System)
        timeout-minutes: 30
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 europe/GAS_TSO_SOUTHEAST_DAILY.py --out-dir "output/Data and Chart Outputs" --only PL

      - name: Pull Romania (Transgaz)
        timeout-minutes: 30
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 europe/GAS_TSO_SOUTHEAST_DAILY.py --out-dir "output/Data and Chart Outputs" --only RO

      - name: Pull Croatia (Plinacro)
        timeout-minutes: 20
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 europe/GAS_TSO_SOUTHEAST_DAILY.py --out-dir "output/Data and Chart Outputs" --only HR

      - name: Pull Finland (Gasgrid)
        timeout-minutes: 10
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 europe/GAS_TSO_SOUTHEAST_DAILY.py --out-dir "output/Data and Chart Outputs" --only FI

      - name: Pull Spain 2021-22 (Enagas bulletins)
        timeout-minutes: 30
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 europe/GAS_TSO_SOUTHEAST_DAILY.py --out-dir "output/Data and Chart Outputs" --only ES

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          python3 add_charts.py "output/Data and Chart Outputs/europe_tso_gas_demand_extra_daily.xlsx" || echo "chart step failed"
          mkdir -p "output/Python Scripts"
          cp europe/GAS_TSO_SOUTHEAST_DAILY.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated workbook
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/europe_tso_gas_demand_extra_daily.xlsx" || true
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Europe TSO gas demand extra (PL, FI, RO, ES): automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
