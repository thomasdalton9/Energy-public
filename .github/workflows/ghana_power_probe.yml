name: Ghana power probe (manual)

on:
  workflow_dispatch: {}
  push:
    branches: [ghana-power]
    paths: ["discovery_archive/ghana/GHANA_POWER_PROBE6.py"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: timeout 400 python3 -u discovery_archive/ghana/GHANA_POWER_PROBE6.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f discovery_archive/results/ghana
          git diff --cached --quiet || git commit -m "Ghana probe 6 results"
          git pull --rebase -X theirs origin ghana-power || true
          git push origin HEAD:ghana-power
