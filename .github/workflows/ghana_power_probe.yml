name: Ghana power probe (manual)

on:
  workflow_dispatch: {}
  push:
    branches: [ghana-power]
    paths: ["discovery_archive/ghana/**", ".github/workflows/ghana_power_probe.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: timeout 400 python3 -u discovery_archive/ghana/GHANA_POWER_PROBE3.py
