name: MISO fuel mix historical backfill

# Manual, one-time: backfills miso_fuel_mix_daily.xlsx from MISO's public
# annual historical_gen_fuel_mix_<YEAR>.xlsx archive (2023-2025 currently
# available), merged into the same Data sheet the daily automation
# (miso_fuel_mix_daily.yml) writes to. See
# americas/MISO_FUEL_MIX_HISTORICAL_BACKFILL.py's docstring. Not scheduled
# - run by hand whenever a fresh backfill/refresh is wanted (e.g. once
# MISO publishes the next year's file).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl requests

      - name: Run backfill
        run: python3 americas/MISO_FUEL_MIX_HISTORICAL_BACKFILL.py --out americas/outputs/miso_fuel_mix_daily.xlsx

      - name: Commit updated archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f americas/outputs/miso_fuel_mix_daily.xlsx
          git diff --cached --quiet || git commit -m "MISO fuel mix: historical backfill (2023-2025)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
