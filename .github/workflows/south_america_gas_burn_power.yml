name: South America gas burn for power

# Rebuilds south_america_gas_burn_power.xlsx (published power-sector gas, then an estimate from gas-fired generation x a
# calibrated heat rate) from the country gas and power workbooks (no downloads) on the 1st and 15th, after that day's
# pulls and before the South America master (21:20).
on:
  schedule:
    - cron: "10 21 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -q pandas openpyxl matplotlib
      - name: Run
        run: python3 south_america/SA_GAS_BURN_POWER.py --out "output/Data and Chart Outputs/south_america_gas_burn_power.xlsx"

      - name: Add Excel charts, PNG charts and copy scripts
        if: always()
        run: |
          F="output/Data and Chart Outputs/south_america_gas_burn_power.xlsx"
          [ -f "$F" ] && python3 add_charts.py "$F" || echo "chart step skipped/failed"
          [ -f "$F" ] && python3 png_charts.py "$F" || echo "PNG step skipped/failed"
          mkdir -p "output/Python Scripts"
          cp south_america/SA_GAS_BURN_POWER.py add_charts.py png_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/south_america_gas_burn_power.xlsx" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/south_america_gas_burn_power.xlsx" "output/PNG Charts" "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "South America gas burn for power: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
