name: Argentina power generation daily

# CAMMESA post-operative daily database (unit-level actual MWh + fuel shares) -> daily MWh by fuel (standard layout). Incremental, newest-first within a time budget; history from 2021-01-01.
on:
  schedule:
    - cron: "11 11 * * 1"
  workflow_dispatch:
    inputs:
      budget_min:
        description: "minutes to spend downloading (one ZIP per day; use ~300 to backfill history)"
        default: "40"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get install -y -q mdbtools >/dev/null
          pip install pandas requests openpyxl
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 19800 python3 south_america/ARGENTINA_POWER_DAILY.py --out "output/Data and Chart Outputs/argentina_power_generation_daily.xlsx" --budget-min "${{ github.event.inputs.budget_min || '40' }}"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/argentina_power_generation_daily.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/argentina_power_generation_daily.xlsx" || echo "chart step skipped/failed for argentina_power_generation_daily.xlsx"
          mkdir -p "output/Python Scripts"
          cp south_america/ARGENTINA_POWER_DAILY.py south_america/argentina_generation_mix.py south_america/power_daily_std.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f "output/Data and Chart Outputs/argentina_power_generation_daily.xlsx" ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/argentina_power_generation_daily.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Argentina power generation: automated update"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
