name: Mexico CENACE data discovery

# Manual, one-off: crawls cenace.gob.mx (Mexico's grid operator) for
# generation/demand data files, embedded chart JSON, or report pages -
# see americas/MEXICO_CENACE_DISCOVERY.py's docstring. Output is in the
# run log and uploaded as an artifact - nothing is committed.
on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run discovery
        run: python3 americas/MEXICO_CENACE_DISCOVERY.py

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mexico-cenace-discovery-output
          path: |
            americas/mexico_cenace_discovery_output.txt
            americas/mx_discovery_*
          if-no-files-found: ignore
