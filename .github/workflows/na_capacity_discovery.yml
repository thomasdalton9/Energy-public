name: NA capacity discovery

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pandas openpyxl
      - name: Run probe
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: timeout 600 python3 discovery_archive/americas/NA_CAPACITY_DISCOVERY.py
