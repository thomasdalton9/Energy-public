name: Nigeria discovery tmp
on:
  push:
    branches: [nigeria-power-niso]
    paths: [".github/workflows/nigeria_discovery_tmp.yml", "discovery_archive/nigeria/**"]
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests
      - run: timeout 400 python3 discovery_archive/nigeria/NIGERIA_NISO_DISCOVERY2.py
