name: Taiwan power (Taipower open data)

# Taipower net generation by unit and fuel (10-minute, ~200 MB per published window). Downloaded only when the file's
# Last-Modified changes; days accumulate in the committed workbook. 1st and 15th.
on:
  schedule:
    - cron: "10 7 1,15 * *"
  workflow_dispatch: {}
  push:
    branches: ["claude/loving-ptolemy-oeieeq"]
    paths:
      - "asia/TAIWAN_POWER_DAILY.py"
      - ".github/workflows/taiwan_power.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl ijson
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 1500 python3 asia/TAIWAN_POWER_DAILY.py --out "output/Data and Chart Outputs/taiwan_power_generation_daily.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/taiwan_power_generation_daily.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/taiwan_power_generation_daily.xlsx" || echo "chart step skipped/failed"
          mkdir -p "output/Python Scripts"
          cp asia/TAIWAN_POWER_DAILY.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated workbook
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f "output/Data and Chart Outputs/taiwan_power_generation_daily.xlsx" ] && git add -f "output/Data and Chart Outputs/taiwan_power_generation_daily.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Taiwan power: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
