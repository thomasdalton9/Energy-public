name: Brent WTI daily

# 1st and 15th at 18:00 UTC. Source: EIA only - API v2 petroleum/pri/spt
# series RBRTE (Brent) and RWTC (WTI) (EIA_API_KEY secret), falling back to
# EIA's keyless RBRTEd.xls / RWTCd.xls. The first run seeds the whole history;
# later runs re-read only the last four weeks.
on:
  schedule:
    - cron: "0 18 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl requests xlrd matplotlib

      - name: Run Brent WTI pull
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: timeout 300 python3 americas/BRENT_WTI_DAILY.py --out "output/Data and Chart Outputs/brent_wti_daily.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/brent_wti_daily.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/brent_wti_daily.xlsx" && python3 png_charts.py "output/Data and Chart Outputs/brent_wti_daily.xlsx" || echo "chart step skipped/failed for brent_wti_daily.xlsx"
          mkdir -p "output/Python Scripts"
          cp americas/BRENT_WTI_DAILY.py add_charts.py png_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f "output/Data and Chart Outputs/brent_wti_daily.xlsx" ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/brent_wti_daily.xlsx"
          git add -f "output/PNG Charts" || true
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Brent WTI daily: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
