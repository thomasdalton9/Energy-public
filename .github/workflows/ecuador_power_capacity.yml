name: Ecuador power capacity

# ARCONEL monthly 'Balance Nacional de Energia Electrica' (nominal / effective capacity by technology).
# Published ~2-3 months after month end; weekly run on Wednesdays, 07:53 UTC.
on:
  schedule:
    - cron: "53 7 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl certifi cryptography xlrd pdfplumber
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 1500 python3 south_america/ECUADOR_ARCONEL_CAPACITY.py --out "output/Data and Chart Outputs/ecuador_power_capacity.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/ecuador_power_capacity.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/ecuador_power_capacity.xlsx" || echo "chart step skipped/failed for ecuador_power_capacity.xlsx"
          mkdir -p "output/Python Scripts"
          cp south_america/ECUADOR_ARCONEL_CAPACITY.py south_america/power_capacity_common.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f "output/Data and Chart Outputs/ecuador_power_capacity.xlsx" ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/ecuador_power_capacity.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Ecuador power capacity: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
