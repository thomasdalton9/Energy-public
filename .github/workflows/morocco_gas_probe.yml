name: Morocco gas probe (manual)

# Manual-only probe runner for the Morocco gas
# discovery scripts. Each entry of `targets` (JSON list) runs as its own job.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script path"
        default: "discovery_archive/africa/MOROCCO_GAS_PROBE.py"
      targets:
        description: "JSON list of arguments, one job each"
        default: '["entsog","enagas","morocco","trade","ember"]'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.event.inputs.targets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pandas openpyxl xlrd pdfplumber beautifulsoup4 odfpy
      - name: Run probe
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 2200 python3 "${{ github.event.inputs.script }}" ${{ matrix.target }} 2>&1 | tee /tmp/probe_out.txt
      # The full output also goes to a throw-away branch (probe-out/morocco-<target>) so it
      # can be fetched and searched locally instead of paging through job logs.
      - name: Save output to branch
        if: always()
        run: |
          T=$(echo "${{ matrix.target }}" | tr -c 'A-Za-z0-9_-' '_')
          mkdir -p /tmp/po && cp /tmp/probe_out.txt "/tmp/po/$T.txt" || true
          cp -r probe_files /tmp/po/ 2>/dev/null || true
          cd /tmp/po && git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "probe output $T"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/probe-out/morocco-$T
