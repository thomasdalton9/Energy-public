name: Cameroon ARSEL energy balance

on:
  schedule:
    - cron: "20 6 1,15 * *"
  workflow_dispatch: {}
  push:
    branches: [cameroon-power]
    paths: [".github/workflows/cameroon_arsel_energy_balance.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl requests pdfplumber matplotlib

      - name: Run Cameroon ARSEL energy balance pull
        run: python3 rest_of_world/cameroon_arsel_energy_balance.py --out "output/Data and Chart Outputs/cameroon_arsel_energy_balance.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/cameroon_arsel_energy_balance.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/cameroon_arsel_energy_balance.xlsx" && python3 png_charts.py "output/Data and Chart Outputs/cameroon_arsel_energy_balance.xlsx" || echo "chart step skipped/failed for cameroon_arsel_energy_balance.xlsx"
          mkdir -p "output/Python Scripts"
          cp rest_of_world/cameroon_arsel_energy_balance.py png_charts.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f "output/Data and Chart Outputs/cameroon_arsel_energy_balance.xlsx" ] && git add -f "output/Data and Chart Outputs/cameroon_arsel_energy_balance.xlsx"
          git add -f "output/Python Scripts" || true
          git add -f "output/PNG Charts" || true
          git diff --cached --quiet || git commit -m "Cameroon ARSEL energy balance: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
