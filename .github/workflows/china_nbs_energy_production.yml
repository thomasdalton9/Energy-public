name: China NBS energy production monthly

# Monthly - NBS publishes industrial/energy output mid-month for the prior month.
# Incremental: only releases not yet in the workbook are fetched (see the script's docstring).
on:
  schedule:
    - cron: "0 12 20 * *"  # 20th of the month - well after NBS's mid-month release
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl requests

      - name: Run China NBS energy production monthly pull
        run: timeout 2700 python3 asia/CHINA_NBS_ENERGY_PRODUCTION.py --out "output/Data and Chart Outputs/china_nbs_energy_production_monthly.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/china_nbs_energy_production_monthly.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/china_nbs_energy_production_monthly.xlsx" || echo "chart step skipped/failed for china_nbs_energy_production_monthly.xlsx"
          mkdir -p "output/Python Scripts"
          cp asia/CHINA_NBS_ENERGY_PRODUCTION.py asia/china_nbs_common.py asia/china_nbs_output.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f "output/Data and Chart Outputs/china_nbs_energy_production_monthly.xlsx" ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/china_nbs_energy_production_monthly.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "China NBS energy production monthly: automated update"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
