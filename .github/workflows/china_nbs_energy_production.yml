name: China NBS energy production monthly

# Monthly - NBS publishes this release once a month (mid-month,
# covering the prior calendar month). Re-running is cheap (re-crawls
# the press-release index and re-parses each release fresh) and picks
# up a source correction to a prior month, not just a newly-added one.
on:
  schedule:
    - cron: "0 12 20 * *"  # 20th of the month - well after NBS's typical mid-month release
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl requests

      - name: Run China NBS energy production pull
        run: timeout 600 python3 asia/CHINA_NBS_ENERGY_PRODUCTION.py --out output/china_nbs_energy_production_monthly.xlsx

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f output/china_nbs_energy_production_monthly.xlsx ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/china_nbs_energy_production_monthly.xlsx
          git diff --cached --quiet || git commit -m "China NBS energy production monthly: automated update"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
