name: Bangladesh gas

# Petrobangla daily gas production and distribution report (one PDF per gas day); backfills every missed day.
on:
  schedule:
    - cron: "52 3 1,15 * *"
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Re-read every report from 2021 (ignore the saved workbook)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl xlrd pdfplumber matplotlib
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 5700 python3 asia/BANGLADESH_PETROBANGLA_GAS.py ${{ inputs.rebuild && '--rebuild' || '' }} || echo "asia/BANGLADESH_PETROBANGLA_GAS.py failed"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/bangladesh_gas.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/bangladesh_gas.xlsx" && python3 png_charts.py "output/Data and Chart Outputs/bangladesh_gas.xlsx" || echo "chart step skipped/failed for bangladesh_gas.xlsx"
          mkdir -p "output/Python Scripts"
          cp png_charts.py asia/BANGLADESH_PETROBANGLA_GAS.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f "output/Data and Chart Outputs/bangladesh_gas.xlsx" ] && git add -f "output/Data and Chart Outputs/bangladesh_gas.xlsx" || true
          git add -f "output/PNG Charts" || true
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Bangladesh gas: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
