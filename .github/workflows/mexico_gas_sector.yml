name: Mexico gas by sector

# Pemex / SENER gas demand by sector via datos.gob.mx (whole-file releases; re-downloaded only when a resource's
# last_modified changes). Source keeps history, so 1st and 15th only. See americas/MEXICO_GAS_SECTOR.py (STATUS note).
on:
  schedule:
    - cron: "41 12 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 1200 python3 americas/MEXICO_GAS_SECTOR.py --out "output/Data and Chart Outputs/mexico_gas_demand_by_sector.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/mexico_gas_demand_by_sector.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/mexico_gas_demand_by_sector.xlsx" || echo "chart step skipped/failed for mexico_gas_demand_by_sector.xlsx"
          mkdir -p "output/Python Scripts"
          cp americas/MEXICO_GAS_SECTOR.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f "output/Data and Chart Outputs/mexico_gas_demand_by_sector.xlsx" ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/mexico_gas_demand_by_sector.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Mexico gas by sector: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
