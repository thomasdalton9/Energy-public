name: China GACC energy imports

# GACC's English monthly bulletin keeps its history (table 14 from Sep 2019), so the pull runs on the 1st and 15th and
# backfills whatever is missing (incremental: only tables not yet in the workbook are fetched).
on:
  schedule:
    - cron: "20 5 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl requests

      - name: Run China GACC energy imports pull
        run: timeout 1500 python3 asia/CHINA_GACC_ENERGY_IMPORTS.py --out "output/Data and Chart Outputs/china_gacc_energy_imports_monthly.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/china_gacc_energy_imports_monthly.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/china_gacc_energy_imports_monthly.xlsx" || echo "chart step skipped/failed for china_gacc_energy_imports_monthly.xlsx"
          mkdir -p "output/Python Scripts"
          cp asia/CHINA_GACC_ENERGY_IMPORTS.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f "output/Data and Chart Outputs/china_gacc_energy_imports_monthly.xlsx" ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/china_gacc_energy_imports_monthly.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "China GACC energy imports: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
