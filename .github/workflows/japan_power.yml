name: Japan power (TSO generation + JEPX prices)

# 10 regional TSOs' area supply-demand CSVs (generation by fuel, demand) and JEPX spot prices. Both sources keep
# history, so the 1st and 15th backfill every missed day (incremental from the committed workbooks).
on:
  schedule:
    - cron: "40 6 1,15 * *"
  workflow_dispatch: {}
  push:
    branches: ["claude/loving-ptolemy-oeieeq"]
    paths:
      - "asia/JAPAN_POWER_DAILY.py"
      - "asia/JAPAN_JEPX_PRICES.py"
      - ".github/workflows/japan_power.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl
      - name: Japan TSO generation
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 2400 python3 asia/JAPAN_POWER_DAILY.py --out "output/Data and Chart Outputs/japan_power_generation_daily.xlsx"
      - name: JEPX prices
        if: always()
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 600 python3 asia/JAPAN_JEPX_PRICES.py --out "output/Data and Chart Outputs/japan_power_prices_daily.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          for f in japan_power_generation_daily japan_power_prices_daily; do
            [ -f "output/Data and Chart Outputs/$f.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/$f.xlsx" || echo "chart step skipped/failed for $f.xlsx"
          done
          mkdir -p "output/Python Scripts"
          cp asia/JAPAN_POWER_DAILY.py asia/JAPAN_JEPX_PRICES.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated workbooks
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in japan_power_generation_daily japan_power_prices_daily; do
            [ -f "output/Data and Chart Outputs/$f.xlsx" ] && git add -f "output/Data and Chart Outputs/$f.xlsx"
          done
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Japan power: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
