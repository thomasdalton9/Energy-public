name: Sri Lanka PUCSL POST inspect

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run inspect
        run: timeout 120 python3 rest_of_world/SRILANKA_PUCSL_POST_INSPECT.py
