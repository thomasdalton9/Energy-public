name: MISO gas burn

# MISO gas burn for power (Bcf/d) = MISO's daily gas MWh x a heat rate calibrated on EIA-923 (MISO balancing
# authority, natural gas plants). Rebuilt from miso_fuel_mix_daily.xlsx; the EIA-923 yearly files (~15 MB) are
# downloaded only when new or changed (see americas/MISO_GAS_BURN.py). Runs after the fuel mix pull.
on:
  schedule:
    - cron: "10 17 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl requests matplotlib

      - name: Run MISO gas burn
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 900 python3 americas/MISO_GAS_BURN.py --out "output/Data and Chart Outputs/miso_gas_burn_daily.xlsx"

      - name: Add Excel charts, PNG charts and copy scripts
        if: always()
        run: |
          f="output/Data and Chart Outputs/miso_gas_burn_daily.xlsx"
          [ -f "$f" ] && python3 add_charts.py "$f" && python3 png_charts.py "$f" || echo "chart step skipped/failed for miso_gas_burn_daily.xlsx"
          mkdir -p "output/Python Scripts"
          cp americas/MISO_GAS_BURN.py png_charts.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/miso_gas_burn_daily.xlsx"
          git add -f "output/PNG Charts" || true
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "MISO gas burn: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
