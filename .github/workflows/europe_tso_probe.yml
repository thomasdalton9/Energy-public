name: Europe TSO probe

# Manual-only probe of national TSO open-data endpoints; archived in discovery_archive/ once settled.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python3 europe/EUROPE_TSO_PROBE.py
