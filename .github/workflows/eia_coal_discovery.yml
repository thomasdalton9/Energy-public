name: EIA coal discovery

# One-off, manual: probe the EIA API v2 coal routes ahead of building
# a weekly coal-basin-price puller.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run discovery probe
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: timeout 120 python3 americas/EIA_COAL_DISCOVERY.py
