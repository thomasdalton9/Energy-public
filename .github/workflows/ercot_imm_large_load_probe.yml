name: ERCOT IMM large load probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pymupdf
      - run: timeout 800 python3 discovery_archive/ERCOT_IMM_LARGE_LOAD_PROBE.py
