name: Mexico CENACE generation by technology

# CENACE keeps the full history (from Apr 2016) and publishes whole months
# (~14 days after each month ends, then later settlements), so the pull
# runs on the 1st and 15th: each run fetches every month not yet saved
# plus the trailing ~10 months to pick up later settlements.
on:
  schedule:
    - cron: "50 10 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas openpyxl playwright matplotlib
          playwright install --with-deps chromium

      - name: Run Mexico generation pull
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 1200 python3 americas/MEXICO_CENACE_GENERATION.py

      - name: Add Excel charts, PNGs and copy scripts
        if: always()
        run: |
          F="output/Data and Chart Outputs/mexico_power_generation_daily.xlsx"
          [ -f "$F" ] && python3 add_charts.py "$F" && python3 png_charts.py "$F" || echo "chart step skipped/failed"
          mkdir -p "output/Python Scripts"
          cp americas/MEXICO_CENACE_GENERATION.py add_charts.py png_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/mexico_power_generation_daily.xlsx" || true
          git add -A -f "output/Data and Chart Outputs/mexico_generacion_hourly" || true
          git add -f "output/PNG Charts" || true
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet && { echo "Nothing to commit."; exit 0; }
          git commit -m "Mexico CENACE generation: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
