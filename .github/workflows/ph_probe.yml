name: Philippines fuel-mix discovery (branch only, temporary)

# One-off source probes. Runs the highest-numbered discovery_archive/asia/PH_DISCOVERY*.py on push to the dev
# branch; moved to discovery_archive/workflows/ once done.
on:
  push:
    branches: [claude/compassionate-darwin-2khdxe]
    paths:
      - "discovery_archive/asia/PH_DISCOVERY*.py"
      - "asia/PHILIPPINES_IEMOP.py"
      - "asia/philippines_resource_fuels.csv"
      - ".github/workflows/ph_probe.yml"
  workflow_dispatch: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pandas openpyxl xlrd pdfplumber lxml html5lib
      - name: Run probe
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          f=$(ls discovery_archive/asia/PH_DISCOVERY*.py | sort -V | tail -1)
          echo "######## $f"; timeout 1500 python3 "$f" || echo "!! exit $?"
