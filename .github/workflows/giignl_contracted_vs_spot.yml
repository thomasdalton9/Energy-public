name: GIIGNL contracted vs spot annual

# Annual - GIIGNL publishes one report per year. Re-running is cheap
# (re-parses every year's PDF fresh each time, ~7 small downloads) and
# picks up a source revision to a prior year, not just a newly-added one.
on:
  schedule:
    - cron: "0 12 1 7 *"  # 1 July - well after GIIGNL's typical release window
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl requests pdfplumber

      - name: Run GIIGNL contracted vs spot pull
        run: timeout 300 python3 americas/GIIGNL_CONTRACTED_VS_SPOT.py --out "output/Data and Chart Outputs/giignl_contracted_vs_spot_annual.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/giignl_contracted_vs_spot_annual.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/giignl_contracted_vs_spot_annual.xlsx" || echo "chart step skipped/failed for giignl_contracted_vs_spot_annual.xlsx"
          mkdir -p "output/Python Scripts"
          cp americas/GIIGNL_CONTRACTED_VS_SPOT.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f "output/Data and Chart Outputs/giignl_contracted_vs_spot_annual.xlsx" ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/giignl_contracted_vs_spot_annual.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "GIIGNL contracted vs spot annual: automated update"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
