name: Texas STEO ids probe (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python3 discovery_archive/americas/TEXAS_STEO_IDS_PROBE.py
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
