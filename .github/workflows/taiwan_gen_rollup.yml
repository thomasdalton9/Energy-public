name: Taiwan generation roll-up

# 10-minute Taipower unit file (rolling three-month window, replaced monthly; Internet Archive copies of older windows) and the Zenodo
# 2017-22 copy, rolled up to daily and monthly average GW. The committed workbook is the history store. 1st and 15th, after taiwan_taipower.
on:
  schedule:
    - cron: "50 3 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl requests

      - name: Run pull
        run: timeout 3000 python3 taiwan/TAIWAN_GEN_ROLLUP.py --out "output/Data and Chart Outputs/taiwan_generation_rollup.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/taiwan_generation_rollup.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/taiwan_generation_rollup.xlsx" || echo "chart step skipped/failed for taiwan_generation_rollup.xlsx"
          mkdir -p "output/Python Scripts"
          cp taiwan/TAIWAN_GEN_ROLLUP.py taiwan/TAIWAN_TAIPOWER.py taiwan/taiwan_charts.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f "output/Data and Chart Outputs/taiwan_generation_rollup.xlsx" ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/taiwan_generation_rollup.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Taiwan generation roll-up: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
