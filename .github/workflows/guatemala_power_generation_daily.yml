name: Guatemala power generation daily

# AMM (Guatemala): daily generation by fuel in the standard layout. GraficaPW
# hourly MW by fuel from 2025-04-01; daily Posdespacho per-unit energy before
# that. Incremental: missing days + last 14; history from 2021-01-01.
on:
  schedule:
    - cron: "41 11 1,15 * *"
  workflow_dispatch:
    inputs:
      refresh_from:
        description: "Optional YYYY-MM-DD: re-fetch every saved day from this date"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install pandas requests openpyxl
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
          REFRESH_FROM: ${{ github.event.inputs.refresh_from }}
        run: timeout 3000 python3 south_america/GUATEMALA_AMM_POWER_DAILY.py --budget-min 42 ${REFRESH_FROM:+--refresh-from "$REFRESH_FROM"} --out "output/Data and Chart Outputs/guatemala_power_generation_daily.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/guatemala_power_generation_daily.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/guatemala_power_generation_daily.xlsx" || echo "chart step skipped/failed for guatemala_power_generation_daily.xlsx"
          mkdir -p "output/Python Scripts"
          cp south_america/GUATEMALA_AMM_POWER_DAILY.py south_america/power_daily_std.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f "output/Data and Chart Outputs/guatemala_power_generation_daily.xlsx" ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/guatemala_power_generation_daily.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Guatemala power generation: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
