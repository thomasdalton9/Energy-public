name: Norway NVE reservoir probe

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pandas
      - name: Run probe
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 discovery_archive/europe/NORWAY_NVE_RESERVOIR_PROBE.py
