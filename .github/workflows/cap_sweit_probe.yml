name: Capacity probe FR ES PT IT
on:
  workflow_dispatch:
    inputs:
      script:
        description: probe script name
        default: CAP_SWEIT_PROBE1.py
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas openpyxl requests beautifulsoup4 lxml curl_cffi
      - run: |
          mkdir -p discovery_archive/results/europe_capacity
          python3 "discovery_archive/europe/capacity/${{ inputs.script }}" 2>&1 | tee "discovery_archive/results/europe_capacity/${{ inputs.script }}.log" || true
      - name: Commit log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f discovery_archive/results/europe_capacity
          git commit -qm "Capacity probe log (${{ inputs.script }})" || exit 0
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
