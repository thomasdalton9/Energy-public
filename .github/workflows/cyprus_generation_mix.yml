name: Cyprus generation mix (TSOC)

# TSOC's archive keeps every day from 2016-10-26 (one page per day), so the pull runs on the 1st and 15th
# and fetches only days after the last saved one; the first runs backfill up to 2,500 days each.
# Manual only (owner, 29 Oct 2026: Europe pulls are not run on a schedule; was cron 45 4 1,15 * *).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas openpyxl requests beautifulsoup4 lxml matplotlib
      - name: Run Cyprus pull
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 3300 python3 europe/cyprus_generation_mix.py --max-days 2500 2> >(grep -v "hourly readings" >&2)
      - name: Add Excel charts, PNGs and copy scripts
        if: always()
        run: |
          F="output/Data and Chart Outputs/cyprus_generation_mix_daily.xlsx"
          [ -f "$F" ] && python3 add_charts.py "$F" && python3 png_charts.py "$F" || echo "chart step skipped/failed"
          mkdir -p "output/Python Scripts"
          cp europe/cyprus_generation_mix.py add_charts.py png_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true
      - name: Commit updated workbook
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/cyprus_generation_mix_daily.xlsx" || true
          git add -f "output/PNG Charts" || true
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet && { echo "Nothing to commit."; exit 0; }
          git commit -m "Cyprus generation mix: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
