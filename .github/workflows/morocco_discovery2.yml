name: Morocco discovery 2
on:
  workflow_dispatch:
  push:
    branches: [morocco-power]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests
      - run: timeout 800 python3 discovery_archive/africa/MOROCCO_DISCOVERY2.py
