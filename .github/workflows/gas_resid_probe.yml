name: Gas residual probe
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas openpyxl
      - name: Spain
        continue-on-error: true
        env:
          GIE_API_KEY: ${{ secrets.GIE_API_KEY }}
        run: timeout 600 python3 discovery_archive/europe/GAS_RESID_ES_PROBE.py
      - name: GB
        continue-on-error: true
        run: timeout 1500 python3 discovery_archive/europe/GAS_RESID_GB_PROBE.py
      - name: France Italy ENTSOG
        continue-on-error: true
        run: timeout 2400 python3 discovery_archive/europe/GAS_RESID_FRIT_PROBE.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add discovery_archive/europe/results/residual
          git commit -m "Gas residual probe results" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
