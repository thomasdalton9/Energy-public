name: Texas gas (EIA)

# Texas natural gas consumption by sector and exports (Mexico pipeline by crossing, LNG by terminal), monthly, Bcf/d,
# plus the LNG demand forecast to Dec 2028 (base / delayed) and the demand-incl-LNG chart.
# EIA state data lag about 2-3 months and keep their history, so 1st/15th is enough (incremental, 3-month revision window).
on:
  schedule:
    - cron: "20 16 1,15 * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Refetch the whole history (from 2015-01)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl requests matplotlib

      - name: Run Texas gas pull
        env:
          PYTHONUNBUFFERED: "1"
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: timeout 900 python3 americas/TEXAS_GAS.py --out "output/Data and Chart Outputs/texas_gas_monthly.xlsx" ${{ inputs.full && '--full' || '' }}

      - name: Add Excel charts, PNG charts and copy scripts
        if: always()
        run: |
          f="output/Data and Chart Outputs/texas_gas_monthly.xlsx"
          [ -f "$f" ] && python3 add_charts.py "$f" && python3 png_charts.py "$f" || echo "chart step skipped/failed for texas_gas_monthly.xlsx"
          mkdir -p "output/Python Scripts"
          cp americas/TEXAS_GAS.py americas/TEXAS_GAS_FORECAST.py png_charts.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/texas_gas_monthly.xlsx"
          git add -f "output/PNG Charts" || true
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Texas gas: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
