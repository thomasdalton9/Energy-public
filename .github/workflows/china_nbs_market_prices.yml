name: China NBS market prices 10-day

# Every 10 days - NBS publishes each 10-day period's prices ~3-4 days after it ends.
# Incremental: only releases not yet in the workbook are fetched (see the script's docstring).
on:
  schedule:
    - cron: "0 9 5,15,25 * *"  # 5th/15th/25th - after each 10-day release
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl requests

      - name: Run China NBS market prices 10-day pull
        run: timeout 2700 python3 asia/CHINA_NBS_MARKET_PRICES.py --out "output/Data and Chart Outputs/china_nbs_market_prices_10day.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/china_nbs_market_prices_10day.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/china_nbs_market_prices_10day.xlsx" || echo "chart step skipped/failed for china_nbs_market_prices_10day.xlsx"
          mkdir -p "output/Python Scripts"
          cp asia/CHINA_NBS_MARKET_PRICES.py asia/china_nbs_common.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f "output/Data and Chart Outputs/china_nbs_market_prices_10day.xlsx" ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/china_nbs_market_prices_10day.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "China NBS market prices 10-day: automated update"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
