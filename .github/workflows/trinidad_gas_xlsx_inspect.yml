name: Trinidad gas Excel structure inspect

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl
      - name: Run inspect
        run: timeout 60 python3 rest_of_world/TRINIDAD_GAS_XLSX_INSPECT.py
