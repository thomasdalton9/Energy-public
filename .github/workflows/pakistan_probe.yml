name: Pakistan power discovery (branch only, temporary)

# One-off source probes. Runs discovery_archive/asia/PAKISTAN_DISCOVERY*.py on push to the dev branch;
# moved to discovery_archive/workflows/ once done.
on:
  push:
    branches: [claude/compassionate-darwin-2khdxe]
    paths:
      - "discovery_archive/asia/PAKISTAN_DISCOVERY*.py"
      - "asia/PAKISTAN_NEPRA.py"
      - ".github/workflows/pakistan_probe.yml"
  workflow_dispatch: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get install -y -qq tesseract-ocr >/dev/null || true
          pip install requests pandas openpyxl xlrd pdfplumber lxml html5lib pytesseract matplotlib
      - name: Run probe
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          f=$(ls discovery_archive/asia/PAKISTAN_DISCOVERY*.py | sort -V | tail -1)
          echo "######## $f"; timeout 2400 python3 "$f" || echo "!! exit $?"
