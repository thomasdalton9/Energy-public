name: Sarawak Energy annual generation

# Sarawak Energy's own Annual and Sustainability Reports (PDF): net energy generated by plant and fuel, annual.
# No monthly or daily data exists. 1st and 15th: the script re-reads the PDFs only when a report is new or changed size
# (the next report is tried at the same URL pattern every run). Weekly pulls would add nothing.
on:
  schedule:
    - cron: "40 3 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl curl_cffi pypdf

      - name: Run Sarawak Energy pull
        env:
          PYTHONUNBUFFERED: "1"
        timeout-minutes: 10
        run: python3 asia/SARAWAK_ENERGY_ASR.py --out "output/Data and Chart Outputs/sarawak_energy_annual.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/sarawak_energy_annual.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/sarawak_energy_annual.xlsx" || echo "chart step skipped/failed for sarawak_energy_annual.xlsx"
          mkdir -p "output/Python Scripts"
          cp asia/SARAWAK_ENERGY_ASR.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f "output/Data and Chart Outputs/sarawak_energy_annual.xlsx" ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/sarawak_energy_annual.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Sarawak Energy annual generation: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
