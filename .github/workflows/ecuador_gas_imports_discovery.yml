name: Ecuador gas imports discovery

on:
  workflow_dispatch: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pdfplumber pandas openpyxl
      - name: Run discovery
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 1080 python3 discovery_archive/south_america/ECUADOR_GAS_IMPORTS_DISCOVERY.py
