name: Great Britain power (Elexon + NESO)

# Daily generation by fuel, load and interconnector flows for Great Britain (europe/GB_POWER_DAILY.py). GB is not in the
# ENTSO-E generation feed, so it comes from Elexon BMRS (FUELHH) and NESO (embedded wind/solar, demand). Both keep full
# history, so it runs on the 1st and 15th like the other Europe pulls; the committed workbook is the history store.
on:
  schedule:
    - cron: "30 1 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gb-power
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl requests

      - name: Run pull
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 europe/GB_POWER_DAILY.py --out-dir "output/Data and Chart Outputs"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          python3 add_charts.py "output/Data and Chart Outputs/great_britain_power_generation_daily.xlsx" || echo "chart step failed"
          mkdir -p "output/Python Scripts"
          cp europe/GB_POWER_DAILY.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated workbook
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/great_britain_power_generation_daily.xlsx" || true
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Great Britain power (Elexon + NESO): automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
