name: Rhine Kaub level

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl requests

      - name: Run Rhine Kaub level pull
        run: python3 rest_of_world/rhine_kaub_level.py --out output/rhine_kaub_level_daily.xlsx

      - name: Commit updated archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f output/rhine_kaub_level_daily.xlsx ] && git add -f output/rhine_kaub_level_daily.xlsx
          git diff --cached --quiet || git commit -m "Rhine Kaub level: automated update"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
