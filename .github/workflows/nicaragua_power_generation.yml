name: Nicaragua power generation (CNDC)

# CNDC post-dispatch energy per generating unit (MWh), mapped to technologies.
# Incremental - fetches only days missing since 2021-01-01 plus the last 14.
# Yesterday's post-dispatch is published during the morning; daily at 17:50 UTC (11:50am Managua).
on:
  schedule:
    - cron: "50 17 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nicaragua_power_generation
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 3600 python3 south_america/NICARAGUA_CNDC_GENERATION_DAILY.py --budget-min 50 --out "output/Data and Chart Outputs/nicaragua_power_generation_daily.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/nicaragua_power_generation_daily.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/nicaragua_power_generation_daily.xlsx" || echo "chart step skipped/failed for nicaragua_power_generation_daily.xlsx"
          mkdir -p "output/Python Scripts"
          cp south_america/NICARAGUA_CNDC_GENERATION_DAILY.py south_america/central_america_power_common.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f "output/Data and Chart Outputs/nicaragua_power_generation_daily.xlsx" ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/nicaragua_power_generation_daily.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Nicaragua power generation: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
