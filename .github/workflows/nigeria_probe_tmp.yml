name: Nigeria probe tmp
on:
  push:
    branches: [nigeria-power-niso]
    paths: [".github/workflows/nigeria_probe_tmp.yml"]
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests pymupdf pandas openpyxl
      - run: timeout 400 python3 discovery_archive/nigeria/NIGERIA_NERC_PDF_PROBE4.py
