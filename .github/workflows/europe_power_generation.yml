name: Europe power generation and gas flows (national TSOs)

# GB (NESO), Belgium (Elia), Denmark (Energinet), Spain (REE) daily generation by fuel, plus Denmark gas flows
# (Energinet). All sources keep history and need no key, so this runs on the 1st and 15th and backfills any gap.
on:
  schedule:
    - cron: '20 6 1,15 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl
      - name: Pull each TSO (one failing source does not stop the others)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          for s in great_britain_generation_neso belgium_generation_elia denmark_generation_energinet spain_generation_ree denmark_gas_energinet; do
            echo "::group::$s"
            timeout 1500 python3 europe/$s.py || echo "::warning::$s failed"
            echo "::endgroup::"
          done
      - name: Add charts
        run: python3 add_charts.py "output/Data and Chart Outputs/great_britain_power_generation_daily.xlsx" "output/Data and Chart Outputs/belgium_power_generation_daily.xlsx" "output/Data and Chart Outputs/denmark_power_generation_daily.xlsx" "output/Data and Chart Outputs/spain_power_generation_daily.xlsx" "output/Data and Chart Outputs/denmark_gas_flows.xlsx"
      - name: Copy scripts
        if: always()
        run: |
          mkdir -p "output/Python Scripts"
          cp europe/europe_common.py europe/great_britain_generation_neso.py europe/belgium_generation_elia.py europe/denmark_generation_energinet.py europe/spain_generation_ree.py europe/denmark_gas_energinet.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in great_britain_power_generation_daily belgium_power_generation_daily denmark_power_generation_daily spain_power_generation_daily denmark_gas_flows; do
            [ -f "output/Data and Chart Outputs/$f.xlsx" ] && git add -f "output/Data and Chart Outputs/$f.xlsx"
          done
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Europe power generation and gas flows: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
