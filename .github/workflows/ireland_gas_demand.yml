name: Ireland gas demand

on:
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl
      - name: Run
        run: timeout 300 python3 europe/ireland_gas_demand.py
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: ireland-gas-demand-output
          path: output/ireland_gas_demand_daily.xlsx
          if-no-files-found: ignore
