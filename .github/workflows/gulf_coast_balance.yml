name: Gulf Coast gas balance

# Texas + Louisiana gas balance, Bcf/d, to Dec 2030 (americas/GULF_COAST_BALANCE.py). Louisiana EIA data keep their history, so the
# schedule is the 1st/15th, after texas_gas (16:20 UTC) and texas_production_forecast (17:40 UTC), which it reads (read only).
on:
  schedule:
    - cron: "10 18 1,15 * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Refetch the whole Louisiana history"
        type: boolean
        default: false
      fetch_only:
        description: "Only update the Louisiana EIA store (debug)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl requests matplotlib

      - name: Run Gulf Coast balance
        env:
          PYTHONUNBUFFERED: "1"
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: timeout 1200 python3 americas/GULF_COAST_BALANCE.py --out "output/Data and Chart Outputs/gulf_coast_gas_balance.xlsx" ${{ inputs.full && '--full' || '' }} ${{ inputs.fetch_only && '--fetch-only' || '' }}

      - name: Add Excel charts, PNG charts and copy scripts
        if: ${{ !inputs.fetch_only }}
        run: |
          f="output/Data and Chart Outputs/gulf_coast_gas_balance.xlsx"
          [ -f "$f" ] && python3 add_charts.py "$f" && python3 png_charts.py "$f" || echo "chart step skipped/failed for gulf_coast_gas_balance.xlsx"
          mkdir -p "output/Python Scripts"
          cp americas/GULF_COAST_BALANCE.py png_charts.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/gulf_coast_gas_balance.xlsx"
          git add -f "output/PNG Charts" || true
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Gulf Coast gas balance: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
