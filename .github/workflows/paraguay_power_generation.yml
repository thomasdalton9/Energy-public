name: Paraguay power generation

# Paraguay's 50% share of Itaipu + Yacyreta by month, Paraguay's own use and the energy ceded to Brazil /
# Argentina (south_america/PARAGUAY_POWER.py). Itaipu publishes its monthly report ~8-10 days after month end;
# ONS and CAMMESA are daily, so a daily run keeps the CAMMESA Yacyreta backfill moving (budgeted, newest first).
on:
  schedule:
    - cron: "41 11 1,15 * *"
  workflow_dispatch:
    inputs:
      budget_min:
        description: "CAMMESA fetch budget (minutes)"
        required: false
        default: "40"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get install -y -q mdbtools >/dev/null
          pip install pandas requests openpyxl pyarrow pdfplumber certifi
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 3600 python3 south_america/PARAGUAY_POWER.py --out "output/Data and Chart Outputs/paraguay_power_generation_daily.xlsx" --budget-min "${{ github.event.inputs.budget_min || '40' }}"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/paraguay_power_generation_daily.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/paraguay_power_generation_daily.xlsx" || echo "chart step skipped/failed for paraguay_power_generation_daily.xlsx"
          mkdir -p "output/Python Scripts"
          cp south_america/PARAGUAY_POWER.py south_america/argentina_generation_mix.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f "output/Data and Chart Outputs/paraguay_power_generation_daily.xlsx" ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/paraguay_power_generation_daily.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Paraguay power generation: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
