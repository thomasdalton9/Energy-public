name: AP industrial coal probe (manual)

# One-off: sources for coal use by industry subsector and coal type in Asia-Pacific. Move to discovery_archive/workflows/ when done.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -q pandas openpyxl xlrd requests pdfplumber
      - name: Run probe
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 1100 python3 discovery_archive/rest_of_world/AP_INDUSTRIAL_COAL_PROBE.py
