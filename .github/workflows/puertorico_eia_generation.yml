name: Puerto Rico EIA generation

# EIA's API returns the full monthly series every call (no incremental
# range query used), so every run just re-fetches and overwrites the
# full archive - no upsert/checkpoint needed. Monthly data, published
# with a lag of a couple months - a weekly check is plenty to catch a
# new month promptly without hammering the API.
on:
  schedule:
    - cron: "0 13 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl
      - name: Run
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: timeout 300 python3 rest_of_world/puertorico_eia_generation.py --out "output/Data and Chart Outputs/puertorico_generation_monthly.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/puertorico_generation_monthly.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/puertorico_generation_monthly.xlsx" || echo "chart step skipped/failed for puertorico_generation_monthly.xlsx"
          mkdir -p "output/Python Scripts"
          cp rest_of_world/puertorico_eia_generation.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f "output/Data and Chart Outputs/puertorico_generation_monthly.xlsx" ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/puertorico_generation_monthly.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Puerto Rico EIA generation: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
