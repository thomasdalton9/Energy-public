name: Australia and NZ power generation and capacity

# NZ generation by fuel (Electricity Authority EMI metered data), WA generation (AEMO WEM facility SCADA),
# Australian registered capacity (NEM registration list + WEM facilities). Incremental: only months/days not
# saved yet plus the latest few are fetched.
on:
  schedule:
    - cron: "40 21 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas openpyxl requests
      - name: NZ generation (EMI)
        if: always()
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 2400 python3 australia_nz/NZ_EMI_GENERATION.py

      - name: WA generation (WEM)
        if: always()
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 2400 python3 australia_nz/AU_WEM_GENERATION.py

      - name: Australia capacity
        if: always()
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 300 python3 australia_nz/AU_POWER_CAPACITY.py

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          for f in nz_power_generation_daily au_wem_power_generation_daily au_power_capacity; do
            [ -f "output/Data and Chart Outputs/$f.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/$f.xlsx" || echo "chart step skipped/failed for $f.xlsx"
          done
          mkdir -p "output/Python Scripts"
          cp australia_nz/NZ_EMI_GENERATION.py australia_nz/AU_WEM_GENERATION.py australia_nz/AU_POWER_CAPACITY.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated workbooks
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in nz_power_generation_daily au_wem_power_generation_daily au_power_capacity; do
            [ -f "output/Data and Chart Outputs/$f.xlsx" ] && git add -f "output/Data and Chart Outputs/$f.xlsx"
          done
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet && { echo "Nothing to commit."; exit 0; }
          git commit -m "Australia and NZ power generation and capacity: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
