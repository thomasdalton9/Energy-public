name: Chile gas demand discovery

on:
  workflow_dispatch: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pdfplumber pandas openpyxl xlrd
      - name: Run discovery
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 1100 python3 discovery_archive/south_america/CHILE_GAS_DEMAND_DISCOVERY.py
