name: Argentina gas

# Monthly Energy Secretariat series, published with a lag of a few
# months. The API returns the full series from 2021 on every call, so
# each run just overwrites those tabs. Exports and imports come from
# ENARGAS's daily export/import reports: the archived "Exports daily" and
# "Imports daily" tabs are kept and only the last 45 days are re-read each
# run. Net supply: ENARGAS monthly operating data (GRT/GETD/CLP xlsx, small,
# re-read whole) plus the daily transport report PDFs ("Transport daily"
# tab: last 45 days re-read, missing days backfilled within a time budget,
# so the first runs fill 2021 onwards over several runs). Weekly is plenty
# to catch a new month promptly.
on:
  schedule:
    - cron: "0 11 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl pdfplumber
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
          PARTES_BUDGET_S: "1200"
        run: timeout 1800 python3 south_america/ARGENTINA_GAS.py --out "output/Data and Chart Outputs/argentina_gas_monthly.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/argentina_gas_monthly.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/argentina_gas_monthly.xlsx" || echo "chart step skipped/failed for argentina_gas_monthly.xlsx"
          mkdir -p "output/Python Scripts"
          cp south_america/ARGENTINA_GAS.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f "output/Data and Chart Outputs/argentina_gas_monthly.xlsx" ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/argentina_gas_monthly.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Argentina gas: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
