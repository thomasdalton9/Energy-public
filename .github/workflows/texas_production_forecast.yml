name: Texas production forecast

# Texas marketed gas production forecast to Dec 2028 (EIA STEO regions, Permian takeaway cap, base and delayed).
# Reads texas_gas_monthly.xlsx (read only; its LNG/consumption forecast feeds the 'Supply and demand' tab, so this runs after texas_gas.yml:
# 16:20 UTC vs 17:40 UTC); see americas/TEXAS_PRODUCTION_FORECAST.py and americas/TEXAS_SUPPLY_DEMAND.py.
on:
  schedule:
    - cron: "40 17 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl requests matplotlib

      - name: Run Texas production forecast
        env:
          PYTHONUNBUFFERED: "1"
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: timeout 900 python3 americas/TEXAS_PRODUCTION_FORECAST.py --out "output/Data and Chart Outputs/texas_production_forecast.xlsx"

      - name: Add Excel charts, PNG charts and copy scripts
        if: always()
        run: |
          f="output/Data and Chart Outputs/texas_production_forecast.xlsx"
          [ -f "$f" ] && python3 add_charts.py "$f" && python3 png_charts.py "$f" || echo "chart step skipped/failed for texas_production_forecast.xlsx"
          mkdir -p "output/Python Scripts"
          cp americas/TEXAS_PRODUCTION_FORECAST.py americas/TEXAS_SUPPLY_DEMAND.py png_charts.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/texas_production_forecast.xlsx"
          git add -f "output/PNG Charts" || true
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Texas production forecast: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
