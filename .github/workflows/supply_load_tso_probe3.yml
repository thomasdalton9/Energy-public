name: Supply vs load TSO probe 3 (manual)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python3 -u discovery_archive/europe/SUPPLY_LOAD_TSO_PROBE3.py 2>&1 | tee probe.log | tail -n 170
