name: EIA-860M balancing authority probe (manual)
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python3 discovery_archive/americas/EIA860M_BA_PROBE.py
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
