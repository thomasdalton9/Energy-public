name: Bolivia gas

# INE monthly gas sales by sector (domestic market), production by department and exports by destination
# (customs micro-data), published with a lag.
on:
  schedule:
    - cron: "5 12 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 900 python3 south_america/BOLIVIA_GAS.py --out "output/Data and Chart Outputs/bolivia_gas_demand_by_sector.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/bolivia_gas_demand_by_sector.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/bolivia_gas_demand_by_sector.xlsx" || echo "chart step skipped/failed for bolivia_gas_demand_by_sector.xlsx"
          mkdir -p "output/Python Scripts"
          cp south_america/BOLIVIA_GAS.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f "output/Data and Chart Outputs/bolivia_gas_demand_by_sector.xlsx" ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/bolivia_gas_demand_by_sector.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Bolivia gas: automated update"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
