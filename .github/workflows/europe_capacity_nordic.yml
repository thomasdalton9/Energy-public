name: Europe capacity - Denmark and Norway (monthly)

# Monthly installed capacity: Denmark from Energinet's CapacityPerMunicipality (wind, solar, thermal total), Norway rebuilt from
# NVE's hydro and wind registers. Sweden, Finland, Estonia, Latvia and Lithuania have no monthly source (see discovery_archive/results/europe_capacity/).
on:
  schedule:
    - cron: "43 5 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas openpyxl requests matplotlib
      - name: Run pull
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 europe/capacity/NORDIC_CAPACITY_MONTHLY.py

      - name: Add Excel charts, PNGs and copy scripts
        if: always()
        run: |
          for f in denmark norway; do
            w="output/Data and Chart Outputs/${f}_power_capacity_monthly.xlsx"
            [ -f "$w" ] && python3 add_charts.py "$w" && python3 png_charts.py "$w" || echo "chart step skipped/failed for $w"
          done
          mkdir -p "output/Python Scripts"
          cp europe/capacity/NORDIC_CAPACITY_MONTHLY.py png_charts.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated workbooks
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/denmark_power_capacity_monthly.xlsx" "output/Data and Chart Outputs/norway_power_capacity_monthly.xlsx" || true
          git add -f "output/PNG Charts" || true
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Europe capacity (Denmark, Norway): automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
