name: Singapore discovery

on:
  workflow_dispatch:
    inputs:
      script:
        description: "discovery_archive/asia script to run"
        default: "SINGAPORE_DISCOVERY6.py"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pandas openpyxl xlrd
      - name: Run discovery
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 1600 python3 "discovery_archive/asia/${{ inputs.script || 'SINGAPORE_DISCOVERY6.py' }}"
