name: Singapore discovery

on:
  workflow_dispatch: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pandas openpyxl
      - name: Run discovery
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 1600 python3 discovery_archive/asia/SINGAPORE_DISCOVERY.py
