name: Thailand gas

# EPPO natural gas tables 3.1-1 (production by field, Myanmar pipeline and LNG imports) and 3.2-2 (use by sector), monthly; whole files re-read each run.
on:
  schedule:
    - cron: "46 4 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl xlrd  matplotlib
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 900 python3 asia/THAILAND_EPPO_GAS.py || echo "asia/THAILAND_EPPO_GAS.py failed"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/thailand_gas.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/thailand_gas.xlsx" && python3 png_charts.py "output/Data and Chart Outputs/thailand_gas.xlsx" || echo "chart step skipped/failed for thailand_gas.xlsx"
          mkdir -p "output/Python Scripts"
          cp png_charts.py asia/THAILAND_EPPO_GAS.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f "output/Data and Chart Outputs/thailand_gas.xlsx" ] && git add -f "output/Data and Chart Outputs/thailand_gas.xlsx" || true
          git add -f "output/PNG Charts" || true
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Thailand gas: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
