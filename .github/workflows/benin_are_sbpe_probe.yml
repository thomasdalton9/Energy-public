name: Benin ARE SBPE probe
on:
  workflow_dispatch:
  push:
    branches: [benin-power]
    paths: ["discovery_archive/rest_of_world/BENIN_ARE_SBPE_PROBE*.py", ".github/workflows/benin_are_sbpe_probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests pdfplumber pypdf openpyxl
      - run: python3 discovery_archive/rest_of_world/BENIN_ARE_SBPE_PROBE.py 2>&1 | tee probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: benin-probe, path: "probe*.txt", if-no-files-found: ignore}
