name: MISO fuel mix chart preview

# Manual, one-off: renders today-so-far's MISO generation-by-fuel-type as a
# PNG chart (see americas/MISO_FUEL_MIX_CHART_PREVIEW.py) and commits it to
# this branch so it can be pulled down and shared - not part of the
# recurring daily pipeline.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas requests matplotlib

      - name: Render chart
        run: python3 americas/MISO_FUEL_MIX_CHART_PREVIEW.py

      - name: Commit chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f americas/miso_fuel_mix_preview.png
          git diff --cached --quiet || git commit -m "MISO fuel mix chart preview: automated render"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
