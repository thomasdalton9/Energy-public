name: Chile hydro reservoirs

# DGA reservoir volumes: daily from the Visualizador Hidrometrico Nacional API
# (from 30-Jun-2024) plus month-end history from DGA's monthly bulletins.
# Incremental: only the days since the last saved one (plus 3) are fetched;
# the bulletin history is read only while some of it is missing.
on:
  schedule:
    - cron: "41 11 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl pdfplumber
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 900 python3 south_america/CHILE_HYDRO_RESERVOIRS.py --out "output/Data and Chart Outputs/chile_hydro_reservoirs.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/chile_hydro_reservoirs.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/chile_hydro_reservoirs.xlsx" || echo "chart step skipped/failed for chile_hydro_reservoirs.xlsx"
          mkdir -p "output/Python Scripts"
          cp south_america/CHILE_HYDRO_RESERVOIRS.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f "output/Data and Chart Outputs/chile_hydro_reservoirs.xlsx" ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/chile_hydro_reservoirs.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Chile hydro reservoirs: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
