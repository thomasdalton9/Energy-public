name: Brazil ANEEL capacity inspect

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pandas
      - name: Run inspect
        run: timeout 240 python3 south_america/BRAZIL_ANEEL_CAPACITY_INSPECT.py
