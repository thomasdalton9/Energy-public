name: North America power by type and Mexico capacity (Ember fallback)

# Ember's monthly electricity release for Canada and Mexico - the fallback
# for the North America master where no raw feed exists (Mexico; Canada
# until the StatCan workbook has a year of history). Weekly is plenty.
on:
  schedule:
    - cron: "55 12 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 400 python3 south_america/EMBER_POWER_BY_TYPE.py --countries "Canada,Mexico" --out "output/Data and Chart Outputs/north_america_power_by_type.xlsx"

      - name: Run (Mexico capacity, Ember yearly - fallback, no raw feed)
        if: always()
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 400 python3 americas/EMBER_CAPACITY.py --country Mexico --out "output/Data and Chart Outputs/mexico_power_capacity.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          for f in north_america_power_by_type mexico_power_capacity; do
            [ -f "output/Data and Chart Outputs/$f.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/$f.xlsx" || echo "chart step skipped/failed for $f.xlsx"
          done
          mkdir -p "output/Python Scripts"
          cp south_america/EMBER_POWER_BY_TYPE.py americas/EMBER_CAPACITY.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated workbook
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in north_america_power_by_type mexico_power_capacity; do
            [ -f "output/Data and Chart Outputs/$f.xlsx" ] && git add -f "output/Data and Chart Outputs/$f.xlsx"
          done
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "North America power by type (Ember): automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
