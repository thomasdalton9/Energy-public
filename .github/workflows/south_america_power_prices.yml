name: South America power prices

# Daily wholesale power prices (headline US$/MWh; local currency kept in the country sheets) for Brazil (ONS CMO), Colombia (XM bolsa),
# Peru (COES CMg Santa Rosa 220), Argentina (CAMMESA CMO / spot), Uruguay (ADME spot), Bolivia (CNDC)
# and Chile (CNE PMM, monthly) - south_america/SA_POWER_PRICES_DAILY.py. A separate workbook, not part of
# the South & Central America master. Incremental: missing days + the last 7 days each run.
# Daily at 14:47 UTC (most sources publish D-1 by then; ADME monthly ~8 days after month end).
on:
  schedule:
    - cron: "47 14 * * 1"
  workflow_dispatch:
    inputs:
      markets:
        description: "comma-separated markets (blank = all)"
        required: false
        default: ""
      start:
        description: "first day to fetch (YYYY-MM-DD, blank = 2021-01-01)"
        required: false
        default: ""
      end:
        description: "last day to fetch (YYYY-MM-DD, blank = today)"
        required: false
        default: ""
      budget_min:
        description: "Argentina download time budget, minutes"
        required: false
        default: "40"
      dry_run:
        description: "true = write to /tmp and commit nothing (testing)"
        required: false
        default: "false"

permissions:
  contents: write

# one live run at a time: runs queue instead of overwriting each other's workbook (dry runs are independent)
concurrency:
  group: south-america-power-prices-${{ github.event.inputs.dry_run == 'true' && github.run_id || 'live' }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      OUT: ${{ github.event.inputs.dry_run == 'true' && '/tmp/south_america_power_prices_daily.xlsx' || 'output/Data and Chart Outputs/south_america_power_prices_daily.xlsx' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install pandas requests openpyxl certifi
          sudo apt-get install -y -q mdbtools >/dev/null
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          ARGS=(--out "$OUT" --budget-min "${{ github.event.inputs.budget_min || '40' }}")
          [ -n "${{ github.event.inputs.markets }}" ] && ARGS+=(--markets "${{ github.event.inputs.markets }}")
          [ -n "${{ github.event.inputs.start }}" ] && ARGS+=(--start "${{ github.event.inputs.start }}")
          [ -n "${{ github.event.inputs.end }}" ] && ARGS+=(--end "${{ github.event.inputs.end }}")
          timeout 19000 python3 south_america/SA_POWER_PRICES_DAILY.py "${ARGS[@]}"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            [ -f "$OUT" ] && python3 add_charts.py "$OUT" || echo "chart step failed"
            exit 0
          fi
          [ -f "$OUT" ] && python3 add_charts.py "$OUT" || echo "chart step skipped/failed for south_america_power_prices_daily.xlsx"
          mkdir -p "output/Python Scripts"
          cp south_america/SA_POWER_PRICES_DAILY.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always() && github.event.inputs.dry_run != 'true'
        run: |
          if [ ! -f "$OUT" ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "$OUT"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "South America power prices: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
