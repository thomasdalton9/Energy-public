name: Europe capacity SE probe

on:
  workflow_dispatch:
    inputs:
      script:
        description: "probe script in discovery_archive/europe/capacity/"
        required: true
        default: "SE_CAPACITY_PROBE1.py"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas openpyxl xlrd lxml beautifulsoup4 curl_cffi pymupdf
      - name: Run probe
        run: timeout 1500 python3 "discovery_archive/europe/capacity/${{ inputs.script }}"
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f discovery_archive/europe/capacity/results || true
          git diff --cached --quiet || git commit -m "SE capacity probe results"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
