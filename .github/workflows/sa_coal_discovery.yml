name: SA coal discovery

on:
  workflow_dispatch:
    inputs:
      which:
        description: "probe functions (space separated), blank = all"
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas openpyxl xlrd pdfplumber
      - name: Probe
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 1700 python3 discovery_archive/south_america/SA_COAL_DISCOVERY.py ${{ github.event.inputs.which }}
