name: Capacity discovery (Peru Bolivia Uruguay Ecuador)

# Manual-only probe for installed-capacity sources (archived copy; copy to .github/workflows to dispatch).
on:
  workflow_dispatch:
    inputs:
      script:
        description: "discovery script under discovery_archive/south_america"
        required: false
        default: "CAPACITY_PBUE_DISCOVERY.py"
      args:
        description: "arguments, e.g. sections: peru bolivia uruguay ecuador ember"
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pandas openpyxl certifi cryptography pdfplumber xlrd odfpy
      - name: Probe
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 1300 python3 "discovery_archive/south_america/${{ github.event.inputs.script }}" ${{ github.event.inputs.args }}
