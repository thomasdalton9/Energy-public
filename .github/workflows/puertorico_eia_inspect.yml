name: Puerto Rico EIA inspect

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run inspect
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: timeout 120 python3 rest_of_world/PUERTORICO_EIA_INSPECT.py
