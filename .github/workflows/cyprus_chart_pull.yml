name: Cyprus chart pull

on:
  workflow_dispatch:

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas openpyxl beautifulsoup4 lxml

      - name: Run pull
        run: timeout 1100 python3 europe/CYPRUS_CHART_PULL.py
