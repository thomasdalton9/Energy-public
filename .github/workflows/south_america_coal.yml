name: South America coal

# Coal production (and Colombia exports) for South America from 2021: ANM Colombia royalty production volumes
# (datos.gov.co, quarterly by department), DANE monthly coal exports, UN Comtrade cross-check, EPE Brazil,
# SE Argentina, Cochilco Chile, MINEM Peru (annual), Energy Institute Statistical Review (Venezuela + cross-check).
# DANE publishes ~6 weeks after month end and ANM updates its open data monthly; weekly run on Tuesdays 14:23 UTC.
on:
  schedule:
    - cron: "23 14 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl certifi pdfplumber
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: timeout 1500 python3 south_america/SOUTH_AMERICA_COAL.py --out "output/Data and Chart Outputs/south_america_coal_production.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/south_america_coal_production.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/south_america_coal_production.xlsx" || echo "chart step skipped/failed for south_america_coal_production.xlsx"
          mkdir -p "output/Python Scripts"
          cp south_america/SOUTH_AMERICA_COAL.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f "output/Data and Chart Outputs/south_america_coal_production.xlsx" ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/south_america_coal_production.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "South America coal: automated update"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X theirs && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
