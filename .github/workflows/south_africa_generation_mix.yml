name: South Africa generation mix

# Every 3 days, via day-of-month stepping (cron has no native "every N
# days from a start date" - this drifts to an uneven gap once per month
# where the day count resets, e.g. day 31 -> day 1). That's harmless
# here: the script always re-fetches Eskom's rolling last-7-days window
# and upserts by date, so an occasional shorter/longer gap between runs
# never skips a day - the source docstring itself says running it more
# often than needed is harmless, and the only real requirement is never
# going longer than 7 days between runs, which this cadence comfortably
# satisfies.
on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl requests

      - name: Run South Africa generation mix pull
        run: python3 south_africa/south_africa_generation_mix.py --out "output/Data and Chart Outputs/south_africa_generation_mix_daily.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/south_africa_generation_mix_daily.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/south_africa_generation_mix_daily.xlsx" || echo "chart step skipped/failed for south_africa_generation_mix_daily.xlsx"
          mkdir -p "output/Python Scripts"
          cp south_africa/south_africa_generation_mix.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "output/Data and Chart Outputs/south_africa_generation_mix_daily.xlsx"
          git diff --cached --quiet || git commit -m "South Africa generation mix: automated update"
          git push
