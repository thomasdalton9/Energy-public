name: Delete temporary Tamar probe branches (one-off)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for b in $(git ls-remote --heads origin 'tmp-tamar-probe-*' | awk '{print $2}' | sed 's#refs/heads/##'); do
            git push origin --delete "$b"
          done
