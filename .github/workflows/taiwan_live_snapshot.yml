name: Taiwan live generation snapshot

# Taipower live per-unit snapshot (d006001, refreshed every 10 minutes, no history): polled hourly, kept as a daily roll-up with the number of polls. Needs its own schedule because the source keeps nothing.
# SCHEDULE DISABLED 11 Oct 2026 at the owner's request (the hourly poll failed on a pandas int64 error); re-add the cron "7 * * * *" to resume.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl requests

      - name: Run pull
        run: timeout 300 python3 taiwan/TAIWAN_LIVE_SNAPSHOT.py --out "output/Data and Chart Outputs/taiwan_live_daily.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/taiwan_live_daily.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/taiwan_live_daily.xlsx" || echo "chart step skipped/failed for taiwan_live_daily.xlsx"
          mkdir -p "output/Python Scripts"
          cp taiwan/TAIWAN_LIVE_SNAPSHOT.py taiwan/taiwan_charts.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f "output/Data and Chart Outputs/taiwan_live_daily.xlsx" ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/taiwan_live_daily.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Taiwan live generation snapshot: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
