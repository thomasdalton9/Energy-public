name: Chile gas imports

# CNE monthly energy report: gas imports (LNG + Argentina pipeline), ~2-month lag.
on:
  schedule:
    - cron: "55 11 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl pdfplumber
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 1500 python3 south_america/CHILE_GAS_IMPORTS.py --out output/chile_gas_imports.xlsx

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f output/chile_gas_imports.xlsx ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/chile_gas_imports.xlsx
          git diff --cached --quiet || git commit -m "Chile gas imports: automated update"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
