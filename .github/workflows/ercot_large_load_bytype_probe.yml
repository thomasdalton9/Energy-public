name: ERCOT large load by-type probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -y && sudo apt-get install -y tesseract-ocr
      - run: pip install requests pymupdf pillow pytesseract pdfplumber openpyxl pypdf
      - run: timeout 1500 python3 discovery_archive/ERCOT_LARGE_LOAD_BYTYPE_PROBE.py
