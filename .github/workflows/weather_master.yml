name: Weather master workbook

# One 'Dashboard - <Region>' page per <region>_degree_days.xlsx (weather/degree_days.py). 1st and 15th evening, after the
# degree-day pulls (01:47 UTC) and before the 23:50 private-repo sync.
on:
  schedule:
    - cron: '58 21 1,15 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas openpyxl matplotlib
      - name: Build master workbook
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 900 python3 weather/WEATHER_MASTER.py --out "output/Data and Chart Outputs/Master Outputs/weather_master.xlsx"

      - name: Copy scripts
        if: always()
        run: |
          mkdir -p "output/Python Scripts"
          cp weather/WEATHER_MASTER.py weather/degree_days.py weather/weather_charts.py south_america/SOUTH_AMERICA_MASTER.py add_charts.py png_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit master workbook
        if: always()
        run: |
          M="output/Data and Chart Outputs/Master Outputs/weather_master.xlsx"
          [ -f "$M" ] || { echo "No master workbook written."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "$M" "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Weather master: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
