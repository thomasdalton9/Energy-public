name: Cameroon tmp
on:
  push:
    branches: [cameroon-power]
    paths: [".github/workflows/cameroon_tmp.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pdfplumber
      - run: timeout 300 python3 -u discovery_archive/rest_of_world/CAMEROON_DISCOVERY6.py
