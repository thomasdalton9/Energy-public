name: China NEA electricity consumption

# NEA's release list keeps its history (the ds_*.json behind the list page holds all of it), so the pull runs on the 1st and 15th
# and backfills whatever is missing (incremental: only releases not yet in the workbook are read, plus the latest two).

on:
  schedule:
    - cron: "40 4 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl requests

      - name: Run pull
        run: timeout 900 python3 asia/CHINA_NEA_CONSUMPTION.py --out "output/Data and Chart Outputs/china_nea_consumption_monthly.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/china_nea_consumption_monthly.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/china_nea_consumption_monthly.xlsx" || echo "chart step skipped/failed for china_nea_consumption_monthly.xlsx"
          mkdir -p "output/Python Scripts"
          cp asia/CHINA_NEA_CONSUMPTION.py asia/nea_common.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f "output/Data and Chart Outputs/china_nea_consumption_monthly.xlsx" ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/china_nea_consumption_monthly.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "China NEA electricity consumption: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
