name: Argentina hydro reservoirs

# Daily lake levels of Argentina's main hydro reservoirs (Comahue: El Chocon, Piedra del Aguila,
# Alicura, Cerros Colorados, Pichi Picun Leufu; Futaleufu; Yacyreta, Salto Grande) and river flows,
# from CAMMESA (daily files + weekly programme back to 2005), AIC and INA. Incremental: the workbook
# is the archive; weekly programmes already read are not fetched again (history is filled newest-first
# within the time budget), INA is re-read from 30 days before its last day, AIC adds today's reading.
on:
  schedule:
    - cron: "7 12 * * *"
  workflow_dispatch:
    inputs:
      budget_min:
        description: "minutes to spend on the weekly-programme backfill (one ZIP per week since 2005)"
        default: "20"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get install -y -q mdbtools >/dev/null
          pip install pandas requests openpyxl
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 4800 python3 south_america/ARGENTINA_HYDRO_RESERVOIRS.py --out "output/Data and Chart Outputs/argentina_hydro_reservoirs.xlsx" --budget-min "${{ github.event.inputs.budget_min || '20' }}"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/argentina_hydro_reservoirs.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/argentina_hydro_reservoirs.xlsx" || echo "chart step skipped/failed for argentina_hydro_reservoirs.xlsx"
          mkdir -p "output/Python Scripts"
          cp south_america/ARGENTINA_HYDRO_RESERVOIRS.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f "output/Data and Chart Outputs/argentina_hydro_reservoirs.xlsx" ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/argentina_hydro_reservoirs.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Argentina hydro reservoirs: automated update"
          for i in 1 2 3 4 5 6; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 7))
          done
          exit 1
