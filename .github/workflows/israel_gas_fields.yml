name: Israel gas by field (company reports)

# Quarterly: NewMed (Leviathan), Tamar Petroleum (Tamar) and Energean (Karish) report 6-10 weeks after each
# quarter, so a run on the 15th of Jan/Apr/Jul/Oct picks up the quarter before. Reports already read are skipped.
on:
  schedule:
    - cron: "35 6 15 1,4,7,10 *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas openpyxl requests pypdf matplotlib
      - name: Run Israel gas fields pull
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 1500 python3 middle_east/ISRAEL_GAS_FIELDS.py
      - name: Add Excel charts, PNGs and copy scripts
        if: always()
        run: |
          F="output/Data and Chart Outputs/israel_gas_fields_quarterly.xlsx"
          [ -f "$F" ] && python3 add_charts.py "$F" && python3 png_charts.py "$F" || echo "chart step skipped/failed"
          mkdir -p "output/Python Scripts"
          cp middle_east/ISRAEL_GAS_FIELDS.py add_charts.py png_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true
      - name: Commit updated workbook
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/israel_gas_fields_quarterly.xlsx" || true
          git add -f "output/PNG Charts" || true
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet && { echo "Nothing to commit."; exit 0; }
          git commit -m "Israel gas by field: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
