name: Egypt gas history probe

on:
  workflow_dispatch:
    inputs:
      round:
        description: probe round
        default: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install requests curl_cffi pandas openpyxl xlrd lxml pdfplumber pymupdf
      - name: Run probe
        env:
          ROUND: ${{ github.event.inputs.round }}
        run: timeout 2100 python3 discovery_archive/middle_east/EGYPT_GAS_HISTORY_PROBE.py
