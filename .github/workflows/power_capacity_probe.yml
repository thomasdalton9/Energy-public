name: Power capacity probe

# Manual-only: probes raw capacity sources (ANEEL, CAMMESA, CNE, XM) and Ember.
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [brazil, argentina, chile, colombia, ember]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl certifi
      - name: Probe
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 1000 python3 discovery_archive/south_america/POWER_CAPACITY_PROBE.py ${{ matrix.target }}
