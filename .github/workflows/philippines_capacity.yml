name: Philippines power capacity

# DOE Power Statistics installed and dependable capacity by plant type (annual PDF; downloaded only on a new release / Last-Modified).
on:
  schedule:
    - cron: "55 3 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl xlrd matplotlib pdfplumber
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          timeout 2100 python3 asia/PHILIPPINES_DOE_CAPACITY.py || echo "asia/PHILIPPINES_DOE_CAPACITY.py failed"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          f="output/Data and Chart Outputs/philippines_power_capacity.xlsx"
          [ -f "$f" ] && python3 add_charts.py "$f" && python3 png_charts.py "$f" || echo "chart step skipped/failed for philippines_power_capacity.xlsx"
          mkdir -p "output/Python Scripts"
          cp png_charts.py asia/PHILIPPINES_DOE_CAPACITY.py south_america/power_capacity_std.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f "output/Data and Chart Outputs/philippines_power_capacity.xlsx" ] && git add -f "output/Data and Chart Outputs/philippines_power_capacity.xlsx" || true
          git add -f "output/PNG Charts" || true
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Philippines power capacity: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
