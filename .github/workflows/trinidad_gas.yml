name: Trinidad gas

# MEEI publishes a new bulletin roughly monthly - weekly is more than
# enough to pick up a new one promptly without hammering the site.
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas openpyxl

      - name: Run Trinidad gas pull
        run: python3 rest_of_world/TRINIDAD_GAS.py --out "output/Data and Chart Outputs/trinidad_gas.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/trinidad_gas.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/trinidad_gas.xlsx" || echo "chart step skipped/failed for trinidad_gas.xlsx"
          mkdir -p "output/Python Scripts"
          cp rest_of_world/TRINIDAD_GAS.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f "output/Data and Chart Outputs/trinidad_gas.xlsx" ] && git add -f "output/Data and Chart Outputs/trinidad_gas.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Trinidad gas: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
