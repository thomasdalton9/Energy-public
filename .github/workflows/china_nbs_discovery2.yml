name: China NBS discovery 2

# Manual-only one-off probes (discovery_archive/asia/CHINA_NBS_DISCOVERY*.py).
on:
  workflow_dispatch:
    inputs:
      script:
        description: "probe script under discovery_archive/asia/"
        default: "CHINA_NBS_DISCOVERY2.py"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pandas openpyxl xlrd
      - name: Run probe
        run: timeout 2100 python3 -u "discovery_archive/asia/${{ inputs.script }}"
