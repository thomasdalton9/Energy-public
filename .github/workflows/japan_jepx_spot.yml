name: Japan JEPX spot prices

# JEPX publishes whole fiscal-year files (history kept at the source): 1st and 15th, the committed workbook is the history store.
on:
  schedule:
    - cron: "30 4 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl requests pymupdf

      - name: Run pull
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 1000 python3 japan/JAPAN_JEPX_SPOT.py --out "output/Data and Chart Outputs/japan_jepx_spot_prices.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/japan_jepx_spot_prices.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/japan_jepx_spot_prices.xlsx" || echo "chart step skipped/failed for japan_jepx_spot_prices.xlsx"
          mkdir -p "output/Python Scripts"
          cp japan/JAPAN_JEPX_SPOT.py japan/japan_charts.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f "output/Data and Chart Outputs/japan_jepx_spot_prices.xlsx" ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/japan_jepx_spot_prices.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Japan JEPX spot prices: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
