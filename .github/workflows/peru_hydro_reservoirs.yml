name: Peru hydro reservoirs

# Weekly useful volume of Peru's reservoirs and lagoons by basin (Junin, Mantaro lagoons, Rimac, Chili, Aricota,
# Sibinacocha ...) and the national total / % from COES' weekly operation report ('Evolucion de volumenes' and
# table 5.1), from 2021. Runs daily: lists COES' weekly folders and reads only reports not yet in the workbook
# ('Reports read') - the newest of each year from 2024 (each restates four years).
on:
  schedule:
    - cron: "53 13 1,15 * *"
  workflow_dispatch:
    inputs:
      test:
        description: "1 = test run (written to /tmp, nothing committed)"
        default: "0"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl
      - name: Test run
        if: github.event.inputs.test == '1'
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 south_america/PERU_HYDRO_RESERVOIRS.py --out /tmp/peru_hydro_reservoirs.xlsx
          python3 add_charts.py /tmp/peru_hydro_reservoirs.xlsx
      - name: Run
        if: github.event.inputs.test != '1'
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 3000 python3 south_america/PERU_HYDRO_RESERVOIRS.py --out "output/Data and Chart Outputs/peru_hydro_reservoirs.xlsx"

      - name: Add Excel charts and copy scripts
        if: always() && github.event.inputs.test != '1'
        run: |
          [ -f "output/Data and Chart Outputs/peru_hydro_reservoirs.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/peru_hydro_reservoirs.xlsx" || echo "chart step skipped/failed for peru_hydro_reservoirs.xlsx"
          mkdir -p "output/Python Scripts"
          cp south_america/PERU_HYDRO_RESERVOIRS.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always() && github.event.inputs.test != '1'
        run: |
          if [ ! -f "output/Data and Chart Outputs/peru_hydro_reservoirs.xlsx" ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/peru_hydro_reservoirs.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Peru hydro reservoirs: automated update"
          for i in 1 2 3 4 5 6; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 7))
          done
          exit 1
