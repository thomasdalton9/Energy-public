name: ERCOT large load by-type probe 3
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -y && sudo apt-get install -y tesseract-ocr
      - run: pip install requests pymupdf pillow pytesseract
      - run: timeout 2000 python3 discovery_archive/ERCOT_LARGE_LOAD_BYTYPE_PROBE3.py
      - name: Commit saved chart images
        if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f discovery_archive/results/ercot_bytype || true
          git diff --cached --quiet || git commit -m "ERCOT by-type probe 3: chart images"
          for i in 1 2 3 4 5; do { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0; sleep $((i*5)); done
