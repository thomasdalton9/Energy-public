name: Dominican Republic gas (SIE)

# SIE monthly fuel consumption for power generation (datos.gob.do open data): natural gas
# burned for the SENI -> dominican_republic_gas.xlsx (sheet "Gas use"). Incremental -
# appends new months and refreshes the last six. SIE updates every few months; weekly
# check on Wednesdays 13:35 UTC.
on:
  schedule:
    - cron: "35 13 * * 3"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dominican_republic_gas
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 600 python3 south_america/DOMINICAN_REPUBLIC_GAS_SIE.py --out "output/Data and Chart Outputs/dominican_republic_gas.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/dominican_republic_gas.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/dominican_republic_gas.xlsx" || echo "chart step skipped/failed for dominican_republic_gas.xlsx"
          mkdir -p "output/Python Scripts"
          cp south_america/DOMINICAN_REPUBLIC_GAS_SIE.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f "output/Data and Chart Outputs/dominican_republic_gas.xlsx" ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/dominican_republic_gas.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Dominican Republic gas: automated update"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X theirs && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
