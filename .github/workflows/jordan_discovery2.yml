name: Jordan discovery 3
on:
  workflow_dispatch:
  push:
    branches: [jordan-power]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests
      - run: timeout 600 python3 discovery_archive/rest_of_world/JORDAN_DISCOVERY3.py 2>&1 | tee jordan.txt
