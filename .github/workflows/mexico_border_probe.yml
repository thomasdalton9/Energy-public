name: Mexico border pipeline probe
on:
  push:
    branches: [claude/vigilant-ritchie-sol4e7]
    paths: [discovery_archive/americas/MEXICO_BORDER_PIPELINE_PROBE.py, .github/workflows/mexico_border_probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests
      - env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python3 discovery_archive/americas/MEXICO_BORDER_PIPELINE_PROBE.py
      - run: |
          git config user.name github-actions; git config user.email actions@github.com
          echo skip
          git commit -m "Mexico border probe output" && git pull --rebase -q origin ${{ github.ref_name }} && git push || true
