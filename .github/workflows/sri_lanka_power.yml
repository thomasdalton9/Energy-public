name: Sri Lanka power

# PUCSL GenData 15-minute dispatch by plant -> daily generation by source. Backfills every missed day.
on:
  schedule:
    - cron: "25 3 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl xlrd
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          timeout 3480 python3 asia/SRI_LANKA_PUCSL.py || echo "asia/SRI_LANKA_PUCSL.py failed"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/sri_lanka_power_generation_daily.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/sri_lanka_power_generation_daily.xlsx" || echo "chart step skipped/failed for sri_lanka_power_generation_daily.xlsx"
          mkdir -p "output/Python Scripts"
          cp asia/SRI_LANKA_PUCSL.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f "output/Data and Chart Outputs/sri_lanka_power_generation_daily.xlsx" ] && git add -f "output/Data and Chart Outputs/sri_lanka_power_generation_daily.xlsx" || true
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Sri Lanka power: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
