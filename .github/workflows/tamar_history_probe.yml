name: Tamar history probe (temporary)

on:
  workflow_dispatch:
    inputs:
      round:
        description: probe round
        default: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pypdf playwright
      - run: playwright install --with-deps chromium
      - run: mkdir -p probe_out
      - run: timeout 2700 python3 discovery_archive/middle_east/ISRAEL_TAMAR_HISTORY_PROBE.py ${{ github.event.inputs.round }} 2>&1 | tee probe_out/log.txt
      - name: Push probe output to a temporary branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan tmp-tamar-probe-${{ github.run_id }}
          git rm -rq --cached . && git add -f probe_out && git commit -qm "probe output" && git push -q origin HEAD
