name: Bangladesh + Thailand pull runner (branch only, temporary)

# Runs the pull commands in asia/BD_TH_PULL_RUN.txt on the development branch, charts the workbooks they
# write and commits them back to the branch. Used to test and backfill the new pulls before their scheduled
# workflows reach main; deleted afterwards.
on:
  push:
    branches: [claude/compassionate-darwin-2khdxe]
    paths:
      - "asia/BD_TH_PULL_RUN.txt"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl xlrd pdfplumber matplotlib
      - name: Run pulls
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          grep -v '^#' asia/BD_TH_PULL_RUN.txt | while read -r line; do
            [ -z "$line" ] && continue
            echo "################ $line"
            timeout 3300 python3 $line || echo "!! exit $?"
          done
      - name: Chart and commit outputs
        if: always()
        run: |
          for f in thailand_gas bangladesh_gas; do
            p="output/Data and Chart Outputs/$f.xlsx"
            [ -f "$p" ] && python3 add_charts.py "$p" && python3 png_charts.py "$p" || echo "chart step skipped/failed for $f"
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/"*gas*.xlsx "output/PNG Charts" || true
          git diff --cached --quiet || git commit -m "Bangladesh + Thailand gas pulls: branch run"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
