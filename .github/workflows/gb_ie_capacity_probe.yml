name: GB IE capacity probe (manual)
on: {workflow_dispatch: {}}
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests
      - run: python3 discovery_archive/europe/capacity/GB_IE_CAPACITY_FETCH_SAMPLES.py
      - name: Commit samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f discovery_archive/results/europe_capacity/gb_ie
          git commit -m "GB/IE capacity source samples"
          for i in 1 2 3 4 5; do { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0; sleep $((i*5)); done; exit 1
