name: Canada power and gas (StatCan)

# Statistics Canada monthly tables 25-10-0015-01 (generation by type) and
# 25-10-0055-01 (natural gas supply and disposition). Each run checks the
# tables' latest month first and downloads only when there is a newer one.
on:
  schedule:
    - cron: "10 13 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas openpyxl requests
      - name: Run StatCan pull
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 900 python3 americas/CANADA_STATCAN.py --power-out "output/Data and Chart Outputs/canada_power_generation_daily.xlsx" --gas-out "output/Data and Chart Outputs/canada_gas.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          for f in canada_power_generation_daily canada_gas; do
            [ -f "output/Data and Chart Outputs/$f.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/$f.xlsx" || echo "chart step skipped/failed for $f.xlsx"
          done
          mkdir -p "output/Python Scripts"
          cp americas/CANADA_STATCAN.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated workbooks
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in canada_power_generation_daily canada_gas; do
            [ -f "output/Data and Chart Outputs/$f.xlsx" ] && git add -f "output/Data and Chart Outputs/$f.xlsx"
          done
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet && { echo "Nothing to commit."; exit 0; }
          git commit -m "Canada power and gas (StatCan): automated update"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
