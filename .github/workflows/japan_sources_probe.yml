name: Japan sources probe

# Manual, one-off: reachability and structure of the candidate Japan sources (moved to discovery_archive/workflows/ after use).
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas pymupdf openpyxl
      - name: Probe
        run: timeout 1000 python3 discovery_archive/japan/JAPAN_SOURCES_PROBE7.py
