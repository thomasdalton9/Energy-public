name: Chile gas demand by sector

# Derived workbook (no network): reads chile_power_generation_daily.xlsx and chile_gas_imports.xlsx already committed
# by their own workflows. Runs 1st/15th, after those pulls.
on:
  schedule:
    - cron: "40 13 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas openpyxl
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 south_america/CHILE_GAS_DEMAND.py

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/chile_gas_demand_by_sector.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/chile_gas_demand_by_sector.xlsx" || echo "chart step skipped/failed"
          mkdir -p "output/Python Scripts"
          cp south_america/CHILE_GAS_DEMAND.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated workbook
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/chile_gas_demand_by_sector.xlsx" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/chile_gas_demand_by_sector.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet && exit 0
          git commit -m "Chile gas demand by sector: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
