name: Central America power discovery

# One-off, manual-only probe for Panama (CND), Costa Rica (CENCE) and
# Nicaragua (CNDC) generation-by-fuel sources. Raw responses go to the
# throwaway branch ca-power-discovery-raw.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Discovery script to run"
        default: "discovery_archive/south_america/CENTRAL_AMERICA_POWER_DISCOVERY.py"
      args:
        description: "Arguments"
        default: ""

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pandas openpyxl xlrd lxml
      - name: Run discovery
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 1500 python3 "${{ inputs.script }}" ${{ inputs.args }}
      - name: Push raw files to a throwaway branch for offline inspection
        if: always()
        run: |
          [ -d ca_raw ] || exit 0
          mv ca_raw /tmp/ca_raw
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ca-power-discovery-raw
          git rm -rfq --cached . >/dev/null
          git clean -fdxq
          mv /tmp/ca_raw ca_raw
          git add ca_raw
          git commit -qm "Central America power discovery raw files (throwaway)"
          git push -f origin ca-power-discovery-raw
