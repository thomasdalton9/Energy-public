name: Europe capacity - France, Spain, Portugal (monthly)

# Monthly installed capacity: France (ODRE national production register, rebuilt + SDES quarterly check), Spain (REE REData),
# Portugal (DGEG monthly renewables PDF, renewables only). Italy has no reachable monthly source (see europe/capacity/SWEIT_CAPACITY_MONTHLY.py).
# Registers and PDFs keep their history, so 1st and 15th; the committed workbooks are the history stores.
# Manual only (owner, 29 Oct 2026: Europe pulls are not run on a schedule; was cron 33 6 1,15 * *).
on:
  workflow_dispatch:
    inputs:
      only:
        description: "countries to run (fr,es,pt)"
        default: "fr,es,pt"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas openpyxl xlrd requests matplotlib pymupdf
      - name: Run pull
        env:
          PYTHONUNBUFFERED: "1"
          ONLY: ${{ inputs.only }}
        run: python3 europe/capacity/SWEIT_CAPACITY_MONTHLY.py --only "${ONLY:-fr,es,pt}"

      - name: Add Excel charts, PNGs and copy scripts
        if: always()
        run: |
          for f in france_power_capacity_monthly spain_power_capacity_monthly portugal_power_capacity_monthly; do
            w="output/Data and Chart Outputs/${f}.xlsx"
            [ -f "$w" ] && python3 add_charts.py "$w" && python3 png_charts.py "$w" || echo "chart step skipped/failed for $w"
          done
          mkdir -p "output/Python Scripts"
          cp europe/capacity/SWEIT_CAPACITY_MONTHLY.py png_charts.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated workbooks
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in france_power_capacity_monthly spain_power_capacity_monthly portugal_power_capacity_monthly; do
            git add -f "output/Data and Chart Outputs/${f}.xlsx" || true
          done
          git add -f "output/PNG Charts" || true
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Europe capacity (FR, ES, PT): automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
