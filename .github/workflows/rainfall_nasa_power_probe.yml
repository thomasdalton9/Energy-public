name: Rainfall NASA POWER probe

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pandas
      - name: Run probe
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 discovery_archive/south_america/RAINFALL_NASA_POWER_PROBE.py
