name: Macro drivers

# World Bank WDI + IMF WEO (re-downloaded each run) and degree days from NASA POWER city temperatures (incremental:
# only days after the last saved one, minus a 10-day revision window).
on:
  schedule:
    - cron: "33 4 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl xlrd matplotlib curl_cffi
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 6000 python3 MACRO_DRIVERS.py || echo "MACRO_DRIVERS.py failed"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/macro_drivers.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/macro_drivers.xlsx" && python3 png_charts.py "output/Data and Chart Outputs/macro_drivers.xlsx" || echo "chart step skipped/failed for macro_drivers.xlsx"
          mkdir -p "output/Python Scripts"
          cp png_charts.py MACRO_DRIVERS.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f "output/Data and Chart Outputs/macro_drivers.xlsx" ] && git add -f "output/Data and Chart Outputs/macro_drivers.xlsx" || true
          git add -f "output/PNG Charts" || true
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Macro drivers: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
