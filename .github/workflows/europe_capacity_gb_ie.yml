name: Europe capacity - United Kingdom and Ireland

# Installed capacity by fuel from the official registers and statistics (DESNZ ET 6.1 / 6.3, REPD, DUKES 5.12 / 5.16;
# EirGrid / ESB Networks registers). Whole-file sources: each run only downloads a file whose address / Last-Modified changed
# (sheet 'Releases'), so most runs are a few HTTP requests.
on:
  schedule:
    - cron: "37 5 1,15 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-download and re-parse every source (true/false)"
        default: "false"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas openpyxl requests matplotlib
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
          FORCE: ${{ github.event.inputs.force }}
        run: |
          args=""
          [ "$FORCE" = "true" ] && args="--force"
          python3 europe/capacity/GB_IE_CAPACITY_MONTHLY.py $args

      - name: Add Excel charts, PNGs and copy scripts
        if: always()
        run: |
          for f in united_kingdom ireland; do
            w="output/Data and Chart Outputs/${f}_power_capacity_monthly.xlsx"
            [ -f "$w" ] && python3 add_charts.py "$w" && python3 png_charts.py "$w" || echo "chart step skipped/failed for $w"
          done
          mkdir -p "output/Python Scripts"
          cp europe/capacity/GB_IE_CAPACITY_MONTHLY.py png_charts.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated workbooks
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/united_kingdom_power_capacity_monthly.xlsx" "output/Data and Chart Outputs/ireland_power_capacity_monthly.xlsx" || true
          git add -f "output/PNG Charts" || true
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Europe capacity (UK, Ireland): automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
