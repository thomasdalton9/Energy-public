name: SK-AT Baumgarten probe (manual)

on:
  workflow_dispatch:
    inputs:
      part:
        default: "1,2,3,4"
      namepat:
        default: "Allok|Netto|Physik|Fluss|Flow"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python3 -u discovery_archive/europe/SK_AT_BAUMGARTEN_PROBE.py
        env:
          PART: ${{ inputs.part }}
          NAMEPAT: ${{ inputs.namepat }}
