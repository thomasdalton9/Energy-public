name: Gas TSO probe 6 (manual)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests playwright && playwright install --with-deps chromium
      - run: python3 discovery_archive/europe/GAS_TSO_PROBE6.py
