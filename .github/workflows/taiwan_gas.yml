name: Taiwan gas (Bureau of Energy E-STAT API)

# Monthly natural gas supply and consumption (table 6-01). The API serves ~3 years, so months accumulate in the
# committed workbook. Monthly data -> 1st and 15th.
on:
  schedule:
    - cron: "30 7 1,15 * *"
  workflow_dispatch: {}
  push:
    branches: ["claude/loving-ptolemy-oeieeq"]
    paths:
      - "asia/TAIWAN_GAS.py"
      - ".github/workflows/taiwan_gas.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 600 python3 asia/TAIWAN_GAS.py --out "output/Data and Chart Outputs/taiwan_gas.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/taiwan_gas.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/taiwan_gas.xlsx" || echo "chart step skipped/failed"
          mkdir -p "output/Python Scripts"
          cp asia/TAIWAN_GAS.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated workbook
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f "output/Data and Chart Outputs/taiwan_gas.xlsx" ] && git add -f "output/Data and Chart Outputs/taiwan_gas.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Taiwan gas: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
