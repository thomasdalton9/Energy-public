name: JODI gas download probe (manual)

# One-off: find the current JODI Gas world database download link (prints to the job log, commits nothing).
# Move to discovery_archive/workflows/ when done.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pandas requests pypdf
      - env:
          PYTHONUNBUFFERED: "1"
        run: timeout 800 python3 discovery_archive/rest_of_world/JODI_GAS_DOWNLOAD_PROBE5.py
