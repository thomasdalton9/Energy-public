name: Brazil power generation (ONS)

# ONS plant-level hourly generation (geracao_usina_2_ho), summed to daily MWh by fuel in the
# standard grid-operator layout. Incremental: only months with missing days + the latest two.
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl pyarrow
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 1800 python3 south_america/BRAZIL_ONS_GENERATION_DAILY.py --out "output/Data and Chart Outputs/brazil_power_generation_daily.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/brazil_power_generation_daily.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/brazil_power_generation_daily.xlsx" || echo "chart step skipped/failed for brazil_power_generation_daily.xlsx"
          mkdir -p "output/Python Scripts"
          cp south_america/BRAZIL_ONS_GENERATION_DAILY.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f "output/Data and Chart Outputs/brazil_power_generation_daily.xlsx" ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/brazil_power_generation_daily.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Brazil power generation (ONS): automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
