name: India gas by sector (PPAC)

# PPAC publishes whole files and keeps history, so this runs on the 1st and 15th and downloads a file only when
# its Last-Modified / size changed. UNVERIFIED until the first run: the Claude sandbox cannot reach ppac.gov.in.
on:
  schedule:
    - cron: "35 6 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl xlrd
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 600 python3 asia/INDIA_PPAC_GAS_BY_SECTOR.py --out "output/Data and Chart Outputs/india_ppac_gas_by_sector.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/india_ppac_gas_by_sector.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/india_ppac_gas_by_sector.xlsx" || echo "chart step skipped/failed for india_ppac_gas_by_sector.xlsx"
          mkdir -p "output/Python Scripts"
          cp asia/INDIA_PPAC_GAS_BY_SECTOR.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f "output/Data and Chart Outputs/india_ppac_gas_by_sector.xlsx" ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/india_ppac_gas_by_sector.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "India gas by sector (PPAC): automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
