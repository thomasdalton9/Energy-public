name: ERCOT load sources probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pypdf openpyxl
      - run: timeout 1300 python3 discovery_archive/ERCOT_LOAD_SOURCES_PROBE.py
