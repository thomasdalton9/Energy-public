name: Argentina power capacity

# CAMMESA 'Potencia Instalada' workbook (Sintesis Mensual > Estadisticas): year-end MW by machine type, the latest
# month's machine list (enabling dates) and retirements, built into monthly MW by fuel from 2021. CAMMESA updates
# it monthly; weekly run on Fridays 11:19 UTC. Saved months are kept; only the latest two are recomputed.
on:
  schedule:
    - cron: "19 11 * * 5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl certifi
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 1500 python3 south_america/ARGENTINA_CAMMESA_CAPACITY.py --out "output/Data and Chart Outputs/argentina_power_capacity.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/argentina_power_capacity.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/argentina_power_capacity.xlsx" || echo "chart step skipped/failed for argentina_power_capacity.xlsx"
          mkdir -p "output/Python Scripts"
          cp south_america/ARGENTINA_CAMMESA_CAPACITY.py south_america/power_capacity_std.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f "output/Data and Chart Outputs/argentina_power_capacity.xlsx" ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/argentina_power_capacity.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Argentina power capacity: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
