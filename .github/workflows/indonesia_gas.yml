name: Indonesia gas

# Ditjen Migas Buku Statistik Migas (half-yearly): monthly gas production by KKKS (MMSCFD) and annual utilisation by sector (BBTUD); a book is downloaded only when new or its Last-Modified changes.
on:
  schedule:
    - cron: "58 4 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl pdfplumber matplotlib
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 2400 python3 asia/INDONESIA_MIGAS_GAS.py || echo "asia/INDONESIA_MIGAS_GAS.py failed"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/indonesia_gas.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/indonesia_gas.xlsx" && python3 png_charts.py "output/Data and Chart Outputs/indonesia_gas.xlsx" || echo "chart step skipped/failed for indonesia_gas.xlsx"
          mkdir -p "output/Python Scripts"
          cp png_charts.py asia/INDONESIA_MIGAS_GAS.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f "output/Data and Chart Outputs/indonesia_gas.xlsx" ] && git add -f "output/Data and Chart Outputs/indonesia_gas.xlsx" || true
          git add -f "output/PNG Charts" || true
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Indonesia gas: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
