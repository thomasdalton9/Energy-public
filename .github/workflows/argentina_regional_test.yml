name: Argentina regional test run 2

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pandas openpyxl
      - name: Run for a small recent range
        run: |
          cd south_america
          FROM=$(date -u -d '5 days ago' +%Y-%m-%d)
          TO=$(date -u -d '2 days ago' +%Y-%m-%d)
          python3 argentina_generation_mix.py --from-date "$FROM" --to-date "$TO" --out /tmp/argentina_test.xlsx --full
          echo "--- sheets ---"
          python3 -c "
import pandas as pd
xl = pd.ExcelFile('/tmp/argentina_test.xlsx')
print(xl.sheet_names)
for name in ['Data', 'By region', 'Regional balance', 'Fuel consumption by region']:
    if name in xl.sheet_names:
        df = xl.parse(name)
        print(f'\n=== {name} ({len(df)} rows) ===')
        print(df.head(15).to_string())
"
