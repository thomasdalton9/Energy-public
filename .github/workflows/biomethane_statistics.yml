name: Europe biomethane statistics (GB, AT, SE, Eurostat annual)

# Biomethane injected into gas grids: DESNZ Energy Trends 4.2 (GB, monthly), AGGM (Austria, monthly), Energimyndigheten (Sweden, annual) and
# Eurostat nrg_bal_c (all EU27 + UK, annual) - europe/BIOMETHANE_STATS.py. All sources keep history, so it runs on the 1st and 15th;
# the committed workbook is the history store.
on:
  schedule:
    - cron: "55 3 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: biomethane-statistics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl requests

      - name: Pull Great Britain (DESNZ)
        timeout-minutes: 10
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 europe/BIOMETHANE_STATS.py --out-dir "output/Data and Chart Outputs" --only gb

      - name: Pull Austria (AGGM)
        timeout-minutes: 10
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 europe/BIOMETHANE_STATS.py --out-dir "output/Data and Chart Outputs" --only at

      - name: Pull Sweden (Energimyndigheten)
        timeout-minutes: 5
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 europe/BIOMETHANE_STATS.py --out-dir "output/Data and Chart Outputs" --only se

      - name: Pull Eurostat annual
        timeout-minutes: 5
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 europe/BIOMETHANE_STATS.py --out-dir "output/Data and Chart Outputs" --only eurostat

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          python3 add_charts.py "output/Data and Chart Outputs/europe_biomethane_statistics.xlsx" || echo "chart step failed"
          mkdir -p "output/Python Scripts"
          cp europe/BIOMETHANE_STATS.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated workbook
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/europe_biomethane_statistics.xlsx" || true
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Europe biomethane statistics: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
