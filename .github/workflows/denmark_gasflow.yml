name: Denmark gas flows (Energinet)

# Denmark's daily commercial gas balance from Energinet's Gasflow dataset - europe/DENMARK_GASFLOW_DAILY.py. The source keeps history,
# so it runs on the 1st and 15th; the committed workbook is the history store.
on:
  schedule:
    - cron: "5 4 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: denmark-gasflow
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl requests

      - name: Pull Energinet Gasflow
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 europe/DENMARK_GASFLOW_DAILY.py --out-dir "output/Data and Chart Outputs"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          python3 add_charts.py "output/Data and Chart Outputs/denmark_energinet_gasflow_daily.xlsx" || echo "chart step failed"
          mkdir -p "output/Python Scripts"
          cp europe/DENMARK_GASFLOW_DAILY.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated workbook
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/denmark_energinet_gasflow_daily.xlsx" || true
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Denmark gas flows (Energinet): automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
