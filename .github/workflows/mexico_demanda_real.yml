name: Mexico demanda real

# CENACE serves whole date ranges per download, so one run can backfill
# the full history (2016-01-29 on) in a few minutes; each run resumes
# from the archive's last saved day and re-fetches the trailing ~8
# months to pick up later settlements. Scheduled daily to keep current
# (CENACE publishes each day ~15 days after it).
on:
  schedule:
    - cron: "30 10 * * 1"
  workflow_dispatch:
    inputs:
      max_days:
        description: "Max days of new history to fetch this run"
        default: "5000"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas openpyxl playwright
          playwright install --with-deps chromium

      - name: Run Mexico demanda real pull
        run: python3 americas/mexico_demanda_real.py --max-days "${{ github.event.inputs.max_days || '5000' }}"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/mexico_demanda_nacional_daily.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/mexico_demanda_nacional_daily.xlsx" || echo "chart step skipped/failed for mexico_demanda_nacional_daily.xlsx"
          mkdir -p "output/Python Scripts"
          cp americas/mexico_demanda_real.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/mexico_demanda_nacional_daily.xlsx" || true
          git add -A -f "output/Data and Chart Outputs/mexico_demanda_por_zona_hourly" || true
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Mexico demanda real: automated backfill/update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
