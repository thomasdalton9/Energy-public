name: MISO fuel mix 2026 gap backfill

# Manual, one-time (re-runnable): fills 2026-01-01-to-date from MISO's
# daily <YYYYMMDD>_sr_gfm.xlsx report, the gap the annual historical
# archive (miso_fuel_mix_historical_backfill.yml) can't cover until MISO
# publishes 2026's file (~Jan 2027). See
# americas/MISO_FUEL_MIX_2026_GAP_BACKFILL.py's docstring. Downloads ~270
# small per-day files, so takes a few minutes.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl requests

      - name: Run gap backfill
        run: python3 americas/MISO_FUEL_MIX_2026_GAP_BACKFILL.py --out "output/Data and Chart Outputs/miso_fuel_mix_daily.xlsx"

      - name: Commit updated archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/miso_fuel_mix_daily.xlsx"
          git diff --cached --quiet || git commit -m "MISO fuel mix: 2026-to-date gap backfill"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
