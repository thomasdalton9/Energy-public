name: US petroleum stocks weekly (Big Four)

# EIA weekly petroleum status report: crude (excl. and incl. SPR), motor gasoline, distillate and jet fuel stocks, plus the
# Big Four total, with week-1-to-52 charts (5-year average, last four years, current year) and Oct-Sep water-year charts.
# EIA API v2 petroleum/stoc/wstk (EIA_API_KEY secret), keyless xls fallback. The history is on EIA's side, so 1st and 15th.
on:
  schedule:
    - cron: "20 4 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl requests xlrd matplotlib

      - name: Run EIA petroleum stocks pull
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          PYTHONUNBUFFERED: "1"
        timeout-minutes: 10
        run: python3 americas/EIA_BIG_FOUR_STORAGE.py --out "output/Data and Chart Outputs/us_petroleum_stocks_weekly.xlsx" --png-dir "output/PNG Charts"

      - name: Copy scripts
        if: always()
        run: |
          mkdir -p "output/Python Scripts"
          cp americas/EIA_BIG_FOUR_STORAGE.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f "output/Data and Chart Outputs/us_petroleum_stocks_weekly.xlsx" ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/us_petroleum_stocks_weekly.xlsx"
          git add -f output/PNG\ Charts/us_*_storage.png || true
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "US petroleum stocks weekly: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
