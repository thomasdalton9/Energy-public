name: South and Central America master workbook

# Combines the South America pulls' workbooks into one master file with a
# Dashboard front page of every chart. Runs after the weekly pulls (Tue
# 11:00-12:05 UTC) and daily so it never lags a re-run.
on:
  schedule:
    - cron: '20 21 * * 1,4'   # Mon + Thu evening, after the weekly pulls
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas openpyxl
      - name: Build master workbook
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 600 python3 south_america/SOUTH_AMERICA_MASTER.py --out "output/Data and Chart Outputs/south_and_central_america_master.xlsx"

      - name: Copy scripts
        if: always()
        run: |
          mkdir -p "output/Python Scripts"
          cp south_america/SOUTH_AMERICA_MASTER.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit master workbook
        if: always()
        run: |
          if [ ! -f "output/Data and Chart Outputs/south_and_central_america_master.xlsx" ]; then
            echo "No master workbook written."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/south_and_central_america_master.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "South & Central America master: automated update"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
