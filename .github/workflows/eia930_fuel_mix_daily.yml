name: EIA-930 fuel mix daily

# Once a day, well after EIA-930 publishes prior-day data (Eastern
# business hours). Backed by a real range API (see the script
# docstring) so a missed run or two just gets caught up on the next
# one - not time-critical the way MISO's "today only" API is.
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl requests

      - name: Run EIA-930 fuel mix pull
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: timeout 600 python3 americas/EIA930_FUEL_MIX_DAILY.py --out output/eia930_fuel_mix_daily.xlsx

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f output/eia930_fuel_mix_daily.xlsx ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/eia930_fuel_mix_daily.xlsx
          git diff --cached --quiet || git commit -m "EIA-930 fuel mix daily: automated update"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
