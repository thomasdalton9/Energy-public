name: Ireland gas combined (open data + GNI transparency)

# Splices the daily open-data workbooks (to 2026-03-31) with the GNI
# transparency workbook (2026-03-31 on) into one continuous file. Runs after
# the three pulls (08:30, 09:10 and the demand pull) each day.
on:
  schedule:
    - cron: "20 10 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas openpyxl
      - name: Build combined workbook
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 600 python3 europe/ireland_gas_combined.py --out "output/Data and Chart Outputs/ireland_gas_combined_daily.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/ireland_gas_combined_daily.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/ireland_gas_combined_daily.xlsx" || echo "chart step skipped/failed"
          mkdir -p "output/Python Scripts"
          cp europe/ireland_gas_combined.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit combined workbook
        if: always()
        run: |
          if [ ! -f "output/Data and Chart Outputs/ireland_gas_combined_daily.xlsx" ]; then
            echo "No combined workbook written."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/ireland_gas_combined_daily.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Ireland gas combined: automated update"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
