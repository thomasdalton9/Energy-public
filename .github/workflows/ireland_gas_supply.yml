name: Ireland gas supply

# GNI's source CSV is a single evergreen file covering all history
# (republished quarterly), so every run re-fetches and overwrites the
# full archive - no upsert/checkpoint needed. Same pattern as the
# demand pull; scheduled 10 minutes after it.
on:
  schedule:
    - cron: "10 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl
      - name: Run
        run: timeout 300 python3 europe/ireland_gas_supply.py --out output/ireland_gas_supply_daily.xlsx

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f output/ireland_gas_supply_daily.xlsx ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/ireland_gas_supply_daily.xlsx
          git diff --cached --quiet || git commit -m "Ireland gas supply: automated update"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
