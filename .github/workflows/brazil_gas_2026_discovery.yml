name: Brazil gas 2026 discovery

on:
  workflow_dispatch:
    inputs:
      script:
        description: "discovery script under discovery_archive/south_america/"
        default: "BRAZIL_GAS_2026_DISCOVERY2.py"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pandas openpyxl xlrd pdfplumber
      - name: Run discovery
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 1080 python3 "discovery_archive/south_america/${{ inputs.script }}"
