name: Ireland generation probe (manual)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python3 discovery_archive/europe/IE_GENERATION_PROBE.py
