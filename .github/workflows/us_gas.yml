name: US gas (EIA)

# EIA Weekly Natural Gas Storage Report is out Thursdays 10:30 ET; the
# monthly consumption/production/trade data (Natural Gas Monthly) land
# around the end of each month, so the weekly run picks them up within a
# week. Also writes Mexico's gas imports from the US (mexico_gas.xlsx).
on:
  schedule:
    - cron: "5 16 * * 4"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas openpyxl requests xlrd
      - name: Run US gas pull
        env:
          PYTHONUNBUFFERED: "1"
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: timeout 600 python3 americas/US_GAS_EIA.py --out "output/Data and Chart Outputs/us_gas.xlsx" --mexico-out "output/Data and Chart Outputs/mexico_gas.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          for f in us_gas mexico_gas; do
            [ -f "output/Data and Chart Outputs/$f.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/$f.xlsx" || echo "chart step skipped/failed for $f.xlsx"
          done
          mkdir -p "output/Python Scripts"
          cp americas/US_GAS_EIA.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated workbooks
        if: always()
        run: |
          ls "output/Data and Chart Outputs/us_gas.xlsx" >/dev/null 2>&1 || { echo "No workbook to commit."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/us_gas.xlsx"
          git add -f "output/Data and Chart Outputs/mexico_gas.xlsx" || true
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "US gas (EIA): automated update"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
