name: Texas STEO and FERC probe (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pypdf pandas openpyxl
      - run: python3 discovery_archive/americas/TEXAS_FERC_LNG_PDF_PROBE.py
