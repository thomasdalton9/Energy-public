name: Europe future power capacity (pipeline)

# Planned / under-construction / retiring generating capacity for Europe in the shared future-capacity row schema:
# Germany MaStR 'In Planung' + Bundesnetzagentur Zu- und Rueckbau, UK REPD + CfD results + NESO TEC, France ODRE queue,
# ENTSO-E ERAA 2025 targets, official-document nuclear / closure facts. Whole files are re-read only when their Last-Modified /
# file name / hash changes (sheet 'Releases'); the workbook is the history store. Charts (native + PNG) are drawn by the script.
# Manual only (owner, 29 Oct 2026: Europe future builds are not run on a schedule; was cron "52 9 1,15 * *").
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Re-read every source even if unchanged (true/false)"
        default: "false"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas openpyxl requests pdfplumber matplotlib
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
          FORCE: ${{ github.event.inputs.force }}
        run: |
          args=""
          [ "$FORCE" = "true" ] && args="--force"
          python3 europe/future/EUROPE_POWER_PIPELINE.py $args

      - name: Add Excel charts (own charts) and copy scripts
        if: always()
        run: |
          python3 add_charts.py "output/Data and Chart Outputs/europe_future_power_capacity.xlsx" || true
          mkdir -p "output/Python Scripts"
          cp europe/future/EUROPE_POWER_PIPELINE.py xlsx_charts.py xlsx_notes.py add_charts.py "output/Python Scripts/" || true

      - name: Commit updated workbook and PNGs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/europe_future_power_capacity.xlsx" || true
          git add -f "output/PNG Charts" || true
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Europe future power capacity: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
