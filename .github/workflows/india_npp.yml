name: India NPP (generation, reservoirs, coal stocks)

# National Power Portal daily reports: conventional generation by fuel (dgr2), hydro reservoir energy content (dgr6)
# and power-plant coal stocks. Backfills every missed day.
on:
  schedule:
    - cron: "50 3 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl xlrd matplotlib
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          timeout 3300 python3 asia/INDIA_NPP.py || echo "asia/INDIA_NPP.py failed"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/india_npp_generation_daily.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/india_npp_generation_daily.xlsx" && python3 png_charts.py "output/Data and Chart Outputs/india_npp_generation_daily.xlsx" || echo "chart step skipped/failed for india_npp_generation_daily.xlsx"
          [ -f "output/Data and Chart Outputs/india_hydro_reservoirs.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/india_hydro_reservoirs.xlsx" && python3 png_charts.py "output/Data and Chart Outputs/india_hydro_reservoirs.xlsx" || echo "chart step skipped/failed for india_hydro_reservoirs.xlsx"
          [ -f "output/Data and Chart Outputs/india_coal_stocks.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/india_coal_stocks.xlsx" && python3 png_charts.py "output/Data and Chart Outputs/india_coal_stocks.xlsx" || echo "chart step skipped/failed for india_coal_stocks.xlsx"
          mkdir -p "output/Python Scripts"
          cp png_charts.py asia/INDIA_NPP.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f "output/Data and Chart Outputs/india_npp_generation_daily.xlsx" ] && git add -f "output/Data and Chart Outputs/india_npp_generation_daily.xlsx" || true
          [ -f "output/Data and Chart Outputs/india_hydro_reservoirs.xlsx" ] && git add -f "output/Data and Chart Outputs/india_hydro_reservoirs.xlsx" || true
          [ -f "output/Data and Chart Outputs/india_coal_stocks.xlsx" ] && git add -f "output/Data and Chart Outputs/india_coal_stocks.xlsx" || true
          git add -f "output/PNG Charts" || true
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "India NPP: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
