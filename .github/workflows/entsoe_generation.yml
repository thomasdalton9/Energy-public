name: Europe power generation and load (ENTSO-E)

# Daily generation by fuel and load for every ENTSO-E country, one workbook per country (europe/ENTSOE_GENERATION_DAILY.py).
# Incremental: reads the committed workbook(s) and fetches only what is missing plus a short revision window;
# a first run backfills and stops gracefully at its time budget (the next run continues).
on:
  schedule:
    - cron: "0 1 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: entsoe-generation
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl requests

      - name: Run pull
        env:
          PYTHONUNBUFFERED: "1"
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: |
          python3 europe/ENTSOE_GENERATION_DAILY.py --out-dir "output/Data and Chart Outputs" --max-minutes 335

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          python3 add_charts.py "output/Data and Chart Outputs/"*_power_generation_daily.xlsx || echo "chart step failed"
          mkdir -p "output/Python Scripts"
          cp europe/ENTSOE_GENERATION_DAILY.py europe/entsoe_common.py europe/europe_countries.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated workbooks
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/"*_power_generation_daily.xlsx || true
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Europe power generation (ENTSO-E): automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
