name: AU gas hub archive probe (manual)

# One-off: how far back AEMO's DWGM and Wallumbilla folders reach. Move to discovery_archive/workflows/ when done.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -q requests pandas openpyxl
      - name: Run probe
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 1100 python3 discovery_archive/rest_of_world/AU_GAS_HUB_ARCHIVE_PROBE.py
