name: Mexico demanda zero check

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Run check
        run: timeout 300 python3 americas/MEXICO_DEMANDA_ZERO_CHECK.py
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: mexico-demanda-zero-check-output
          path: americas/mexico_demanda_zero_check_output.txt
          if-no-files-found: ignore
