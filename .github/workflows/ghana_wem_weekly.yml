name: Ghana power generation by plant (Energy Commission weekly WEM statistics)

# Daily GWh per plant from the Energy Commission's weekly WEM statistics PDFs. The site keeps all weeks online, so this follows the 1st/15th rule; the committed workbook is the history store (only new PDFs are read).
on:
  schedule:
    - cron: "20 5 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas openpyxl requests pymupdf pdfplumber
      - name: Run pull
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 3000 python3 -u africa/GHANA_WEM_WEEKLY_POWER.py --budget-min 40 --out "output/Data and Chart Outputs/ghana_wem_weekly_generation_daily.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/ghana_wem_weekly_generation_daily.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/ghana_wem_weekly_generation_daily.xlsx" || echo "chart step skipped/failed for ghana_wem_weekly_generation_daily.xlsx"
          mkdir -p "output/Python Scripts"
          cp africa/GHANA_WEM_WEEKLY_POWER.py africa/ghana_wem_parse.py africa/ghana_charts.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f "output/Data and Chart Outputs/ghana_wem_weekly_generation_daily.xlsx" ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/ghana_wem_weekly_generation_daily.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Ghana weekly WEM generation: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
