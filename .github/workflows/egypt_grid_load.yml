name: Egypt grid load (MOEE)

# The Ministry of Electricity's home-page 'Grid Loads' panel shows only the current day (yesterday's peak and
# minimum, today's expected peak) and keeps no history, so it is saved every day; two runs a day so one failed
# run loses nothing (the second finds the same page and changes nothing).
on:
  schedule:
    - cron: "25 7 * * *"
    - cron: "25 19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas openpyxl requests matplotlib
      - name: Run Egypt grid load pull
        run: timeout 300 python3 africa/EGYPT_MOEE_GRID_LOAD.py
      - name: Add Excel charts, PNGs and copy scripts
        if: always()
        run: |
          F="output/Data and Chart Outputs/egypt_grid_load_daily.xlsx"
          [ -f "$F" ] && python3 add_charts.py "$F" && python3 png_charts.py "$F" || echo "chart step skipped/failed"
          mkdir -p "output/Python Scripts"
          cp africa/EGYPT_MOEE_GRID_LOAD.py add_charts.py png_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true
      - name: Commit updated workbook
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/egypt_grid_load_daily.xlsx" || true
          git add -f "output/PNG Charts" || true
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet && { echo "Nothing to commit."; exit 0; }
          git commit -m "Egypt grid load: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
