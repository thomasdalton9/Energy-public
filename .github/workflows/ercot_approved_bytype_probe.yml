name: ERCOT approved by type probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -y && sudo apt-get install -y tesseract-ocr
      - run: pip install requests pymupdf pillow pytesseract python-pptx
      - run: timeout 1500 python3 discovery_archive/ERCOT_APPROVED_BYTYPE_PROBE.py
      - name: Commit saved images
        if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f discovery_archive/results/ercot_bytype || true
          git diff --cached --quiet || git commit -m "ERCOT approved-by-type probe: slide images"
          for i in 1 2 3 4 5; do { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0; sleep $((i*5)); done
