name: Canada CER open data (gas trade, electricity trade, generation by province)

# CER files are whole-file downloads, fetched only when their Last-Modified changes.
on:
  schedule:
    - cron: "40 13 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas openpyxl requests matplotlib
      - name: Run CER pull
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 600 python3 americas/CANADA_CER.py --gas-out "output/Data and Chart Outputs/canada_cer_gas.xlsx" --power-out "output/Data and Chart Outputs/canada_cer_power.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          for f in canada_cer_gas canada_cer_power; do
            [ -f "output/Data and Chart Outputs/$f.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/$f.xlsx" && python3 png_charts.py "output/Data and Chart Outputs/$f.xlsx" || echo "chart step skipped/failed for $f.xlsx"
          done
          mkdir -p "output/Python Scripts"
          cp png_charts.py americas/CANADA_CER.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated workbooks
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in canada_cer_gas canada_cer_power; do
            [ -f "output/Data and Chart Outputs/$f.xlsx" ] && git add -f "output/Data and Chart Outputs/$f.xlsx"
          done
          git add -f "output/PNG Charts" || true
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet && { echo "Nothing to commit."; exit 0; }
          git commit -m "Canada CER open data: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
