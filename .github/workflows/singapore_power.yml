name: Singapore power

# EMA half-hourly system demand (weekly .xls, published a few days after each
# week), EMC/NEMS metered generation by facility type, SingStat monthly
# generation and EMA SES annual tables. Weekly, after EMA's Wednesday upload.
on:
  schedule:
    - cron: "20 6 * * 4"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl xlrd
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 2100 python3 asia/SINGAPORE_POWER.py --out "output/Data and Chart Outputs/singapore_power.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/singapore_power.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/singapore_power.xlsx" || echo "chart step skipped/failed for singapore_power.xlsx"
          mkdir -p "output/Python Scripts"
          cp asia/SINGAPORE_POWER.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f "output/Data and Chart Outputs/singapore_power.xlsx" ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/singapore_power.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Singapore power: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
