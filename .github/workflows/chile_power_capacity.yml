name: Chile power capacity

# CNE monthly 'Capacidad Instalada de Generacion' workbook (cne.cl), net MW by technology from 2021. CNE uploads
# about the 10th of each month; weekly run on Thursdays 10:37 UTC. Saved months are kept; only the latest two are
# recomputed from each upload.
on:
  schedule:
    - cron: "37 10 * * 4"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl certifi
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 1500 python3 south_america/CHILE_CNE_CAPACITY.py --out "output/Data and Chart Outputs/chile_power_capacity.xlsx"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/chile_power_capacity.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/chile_power_capacity.xlsx" || echo "chart step skipped/failed for chile_power_capacity.xlsx"
          mkdir -p "output/Python Scripts"
          cp south_america/CHILE_CNE_CAPACITY.py south_america/CHILE_POWER_DAILY.py south_america/power_capacity_std.py south_america/power_daily_std.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          if [ ! -f "output/Data and Chart Outputs/chile_power_capacity.xlsx" ]; then
            echo "No archive file to commit (pull failed before writing it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/chile_power_capacity.xlsx"
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Chile power capacity: automated update"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X theirs && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
