name: Jordan annual reports probe

on:
  workflow_dispatch:
    inputs:
      which:
        description: all / nepco / memr
        default: "all"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pdfplumber
      - name: Run probe
        run: timeout 5000 python3 discovery_archive/middle_east/JORDAN_ANNUAL_REPORTS_PROBE.py ${{ github.event.inputs.which }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe_out
          path: probe_out
          if-no-files-found: ignore
