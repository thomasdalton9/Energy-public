name: LNG feedgas daily

# Every morning at 11:40 UTC (6:40am CDT / 5:40am CST) - after the
# previous gas day's final intraday cycle is posted, and before 9am
# Central, when Enbridge's page rolls its default to the new gas day
# (the script only reads Enbridge's default day). Pulls yesterday's
# scheduled deliveries into each LNG terminal and upserts them into
# americas/feedgas_ebb/lng_feedgas_daily.xlsx - touches nothing else.
#
# Two more short runs a day (17:40 and 23:40 UTC) only re-save TC Energy's
# latest posting (ANR -> Calcasieu Pass, Columbia Gulf -> Cameron): TC keeps
# no history, so this covers a missed morning run and keeps the latest
# intraday cycle for each gas day. They change nothing else.
on:
  schedule:
    - cron: "40 11 * * *"
    - cron: "40 17 * * *"
    - cron: "40 23 * * *"
  workflow_dispatch:
    inputs:
      date_from:
        description: "One-off backfill: first gas day, YYYY-MM-DD (blank = normal daily run)"
        required: false
        default: ""
      date_to:
        description: "Backfill: last gas day, YYYY-MM-DD (blank = yesterday)"
        required: false
        default: ""
      only:
        description: "Backfill just these platforms, comma-separated (e.g. transco); blank = all"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    # a backfill of a few months takes hours; the daily run takes minutes
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas openpyxl playwright requests xlrd
          python3 -m playwright install --with-deps chromium

      - name: Pull LNG feedgas
        env:
          DATE_FROM: ${{ inputs.date_from }}
          DATE_TO: ${{ inputs.date_to }}
          ONLY: ${{ inputs.only }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$SCHEDULE" ] && [ "$SCHEDULE" != "40 11 * * *" ]; then
            python3 americas/feedgas_ebb/lng_feedgas_daily.py --tc-only
          elif [ -n "$DATE_FROM" ]; then
            # a backfill saves and pushes after every day, with the day's
            # progress line as the commit message, so it can be followed
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            FEEDGAS_SAVE_EVERY=1 FEEDGAS_PUSH_EACH_DAY=1 \
              python3 americas/feedgas_ebb/lng_feedgas_daily.py --from "$DATE_FROM" ${DATE_TO:+--to "$DATE_TO"} ${ONLY:+--only "$ONLY"}
          else
            python3 americas/feedgas_ebb/lng_feedgas_daily.py
          fi

      - name: Commit updated workbook
        # always: a backfill cut off by the timeout still keeps the days it saved
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f americas/feedgas_ebb/lng_feedgas_daily.xlsx
          git diff --cached --quiet || git commit -m "LNG feedgas daily: automated update"
          # the run can leave other files modified (logs, caches) - set them
          # aside for the rebase, and retry if another job pushed meanwhile
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
