name: Malaysia Philippines gas probe

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pdfplumber openpyxl pandas lxml playwright && playwright install --with-deps chromium
      - name: Run probe
        run: timeout 1200 python3 discovery_archive/asia/MALAYSIA_PHILIPPINES_GAS_PROBE.py
