name: PMO deck discovery (one-off, manual)

# One-off: probes where the NEWAVE deck's load forecast and expansion schedule can be fetched
# from a GitHub runner. Commits nothing. Move to discovery_archive/workflows/ when done.
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run probe
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 500 python3 discovery_archive/PMO_DECK_DISCOVERY.py
