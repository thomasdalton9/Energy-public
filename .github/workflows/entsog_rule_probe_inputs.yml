name: ENTSOG rule probe with inputs (manual)

on:
  workflow_dispatch:
    inputs:
      pairs:
        description: "country pairs, e.g. CZ-DE,CZ-SK"
        default: "CZ-DE,CZ-SK,CZ-PL"
      date_from:
        default: "2023-05-01"
      date_to:
        default: "2023-06-30"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas openpyxl
      - run: python3 -u discovery_archive/europe/ENTSOG_RULE_PROBE.py "${{ inputs.date_from }}" "${{ inputs.date_to }}"
        env:
          PAIRS: ${{ inputs.pairs }}
