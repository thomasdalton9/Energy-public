name: Pakistan reservoirs

# IRSA daily water situation (Tarbela, Mangla, Chashma levels and flows). IRSA keeps only about a week of reports
# (no history), so this runs DAILY; each run reads every listed report not saved yet.
on:
  schedule:
    - cron: "20 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl xlrd matplotlib pdfplumber
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          timeout 1500 python3 asia/PAKISTAN_IRSA_RESERVOIRS.py || echo "asia/PAKISTAN_IRSA_RESERVOIRS.py failed"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/pakistan_hydro_reservoirs.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/pakistan_hydro_reservoirs.xlsx" && python3 png_charts.py "output/Data and Chart Outputs/pakistan_hydro_reservoirs.xlsx" || echo "chart step skipped/failed for pakistan_hydro_reservoirs.xlsx"
          mkdir -p "output/Python Scripts"
          cp png_charts.py asia/PAKISTAN_IRSA_RESERVOIRS.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f "output/Data and Chart Outputs/pakistan_hydro_reservoirs.xlsx" ] && git add -f "output/Data and Chart Outputs/pakistan_hydro_reservoirs.xlsx" || true
          git add -f "output/PNG Charts" || true
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Pakistan reservoirs: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
