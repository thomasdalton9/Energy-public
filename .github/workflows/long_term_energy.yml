name: Long-term energy

# Long annual history for the fundamentals pages: Ember yearly power (2000+) and the Energy Institute Statistical Review (1965+); whole files, re-downloaded only when they change.
on:
  schedule:
    - cron: "47 4 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl matplotlib pycountry curl_cffi
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 2400 python3 LONG_TERM_ENERGY.py || echo "LONG_TERM_ENERGY.py failed"

      - name: Add Excel charts and copy scripts
        if: always()
        run: |
          [ -f "output/Data and Chart Outputs/long_term_energy.xlsx" ] && python3 add_charts.py "output/Data and Chart Outputs/long_term_energy.xlsx" && python3 png_charts.py "output/Data and Chart Outputs/long_term_energy.xlsx" || echo "chart step skipped/failed for long_term_energy.xlsx"
          mkdir -p "output/Python Scripts"
          cp png_charts.py LONG_TERM_ENERGY.py add_charts.py xlsx_charts.py xlsx_notes.py water_year_chart.py "output/Python Scripts/" || true

      - name: Commit updated archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f "output/Data and Chart Outputs/long_term_energy.xlsx" ] && git add -f "output/Data and Chart Outputs/long_term_energy.xlsx" || true
          git add -f "output/PNG Charts" || true
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet || git commit -m "Long-term energy: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
