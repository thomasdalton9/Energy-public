name: Global LNG liquefaction capacity

# 1st and 15th: the EIA workbook is quarterly and the other sources are whole documents that keep their history; the
# script downloads the EIA file with a conditional request, re-parses it only when it changed, and checks each curated
# source document for a new version (Releases sheet). The committed workbook is the history store.
on:
  schedule:
    - cron: "19 9 1,15 * *"
  workflow_dispatch:
    inputs:
      full:
        description: "re-read every whole file (true/false)"
        default: "false"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas openpyxl requests matplotlib curl_cffi
      - name: Run global LNG liquefaction build
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          ARGS=""
          [ "${{ github.event.inputs.full }}" = "true" ] && ARGS="--full"
          timeout 900 python3 global_lng/GLOBAL_LIQUEFACTION.py $ARGS
      - name: Copy scripts
        if: always()
        run: |
          mkdir -p "output/Python Scripts"
          cp global_lng/GLOBAL_LIQUEFACTION.py xlsx_charts.py xlsx_notes.py "output/Python Scripts/" || true
      - name: Commit updated workbook and charts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "output/Data and Chart Outputs/global_lng_liquefaction_capacity.xlsx" || true
          git add -f "output/PNG Charts/global_lng_liquefaction_capacity__Nameplate_by_month.png" "output/PNG Charts/global_lng_liquefaction_capacity__Additions_by_year.png" || true
          git add -f "output/Python Scripts" || true
          git diff --cached --quiet && { echo "Nothing to commit."; exit 0; }
          git commit -m "Global LNG liquefaction: automated update"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
