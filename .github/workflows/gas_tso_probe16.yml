name: Gas TSO probe 16 (manual)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas openpyxl pdfplumber playwright && playwright install --with-deps chromium
      - run: python3 discovery_archive/europe/GAS_TSO_PROBE16.py > probe16.log 2>&1; head -c 40000 probe16.log | cut -c1-600
