name: Nigeria power-sector data discovery

# Manual, one-off: probes candidate Nigerian grid/power-sector sites (TCN,
# NERC, NBET - see africa/NIGERIA_TCN_DISCOVERY.py's docstring for why
# these and not a confirmed URL) for generation/demand data files or API
# endpoints. Output is in the run log and uploaded as an artifact -
# nothing is committed.
on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run discovery
        run: python3 africa/NIGERIA_TCN_DISCOVERY.py

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nigeria-discovery-output
          path: africa/nigeria_discovery_output.txt
          if-no-files-found: ignore
