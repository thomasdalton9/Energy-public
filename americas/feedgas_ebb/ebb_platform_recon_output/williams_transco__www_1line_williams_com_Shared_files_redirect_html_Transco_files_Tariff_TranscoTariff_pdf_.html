<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd"><html lang="en" xml:lang="en" xmlns="http://www.w3.org/1999/xhtml"><head>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
    <title>redirect</title>
    <style type="text/css">
        .loader-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            font-family: Arial, sans-serif;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loader-text {
            margin-top: 15px;
            color: #666;
        }
    </style>
    <script language="javascript" type="text/javascript">
        function redirect() {
            var cmdline = location.toString();
            var i = cmdline.indexOf("redirect.html?");
            
            if (i > 0) {
                i += 14;
                var s = cmdline.substring(i);
                cmdline = s;
            } else {
                i = cmdline.indexOf("/render");
                if (i > 0) {
                    document.getElementById("loader-container").innerHTML = 
                        "Redirected file will appear here when published.";
                }
                return;
            }

            var h = cmdline.indexOf("#");
            var i = cmdline.indexOf("&");
            if (i > 0 && (h == 0 || i < h)) {
                cmdline = cmdline.substring(0, i) + "?" + cmdline.substring(i + 1);
            }

            window.location = cmdline;
        }
    </script>
</head>
<body>
    <div id="loader-container" class="loader-container">
        <div class="loader"></div>
        <div class="loader-text">Loading...</div>
    </div>
    <script language="javascript" type="text/javascript">
        redirect();
    </script></body></html>
