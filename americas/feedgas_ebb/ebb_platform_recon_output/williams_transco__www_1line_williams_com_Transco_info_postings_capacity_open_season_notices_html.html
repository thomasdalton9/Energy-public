<script type="text/javascript">
//<![CDATA[
(function() {
  var iframe = document.getElementById('theiframe');
  
  // Listen for height from Angular app and relay to parent
  window.addEventListener('message', function(event) {
    if (event.data && event.data.type === 'portalIframeResize') {
      if (iframe && event.data.height) {
        // Set the inner iframe height
        var newHeight = Math.max(600, event.data.height);
        iframe.style.height = newHeight + 'px';
        
        // Calculate total page height including all content
        var totalHeight = 0;
        var contentRegion = document.getElementById('contentRegion');
        if (contentRegion) {
          totalHeight = contentRegion.scrollHeight;
        }
        
        // Add height of regulatory comment cards if present
        var regComments = document.querySelectorAll('.regulatoryComment');
        regComments.forEach(function(el) {
          var card = el.closest('.portal-card');
          if (card && card !== contentRegion) {
            totalHeight += card.offsetHeight;
          }
        });
        
        // Relay total height to parent window (interiorFrame's parent)
        if (window.parent !== window) {
          window.parent.postMessage({
            type: 'portalIframeResize',
            height: totalHeight
          }, '*');
        }
      }
    }
    
    // Relay parent window height down to Angular app
    if (event.data && event.data.type === 'portalParentHeight') {
      if (iframe && iframe.contentWindow) {
        iframe.contentWindow.postMessage(event.data, '*');
      }
    }
  });
  
  // Send window height to Angular app on load and resize
  function sendHeightToAngular() {
    if (iframe && iframe.contentWindow) {
      // Use top window height if available, otherwise current window
      var height = window.top ? window.top.innerHeight : window.innerHeight;
      iframe.contentWindow.postMessage({
        type: 'portalParentHeight',
        height: height
      }, '*');
    }
  }
  
  // Send on iframe load
  iframe.addEventListener('load', function() {
    setTimeout(sendHeightToAngular, 100);
  });
  
  // Send on window resize
  var resizeTimer;
  window.addEventListener('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(sendHeightToAngular, 100);
  });
})();
//]]>
</script>
