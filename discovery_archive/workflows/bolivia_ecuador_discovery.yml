name: Bolivia and Ecuador regional discovery

on:
  workflow_dispatch:

jobs:
  bolivia:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run probe
        run: timeout 300 python3 south_america/BOLIVIA_CNDC_DISCOVERY.py

  ecuador_regional:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run probe
        run: timeout 300 python3 south_america/ECUADOR_REGIONAL_DISCOVERY.py
