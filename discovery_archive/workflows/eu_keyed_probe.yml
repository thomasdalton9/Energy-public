name: EU keyed probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run probe
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          GIE_API_KEY: ${{ secrets.GIE_API_KEY }}
        run: timeout 1200 python3 discovery_archive/europe/EU_KEYED_PROBE.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eu_keyed_probe_report
          path: eu_keyed_probe_report.json
