name: GB station load probe (manual)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas openpyxl
      - run: python3 -u discovery_archive/europe/GB_STATION_LOAD_PROBE.py 2>&1 | tail -30
