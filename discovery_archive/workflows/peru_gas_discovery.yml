name: Peru gas discovery

# Manual-only probe for Peru gas demand by sector sources
# (discovery_archive/south_america/PERU_GAS_DEMAND_DISCOVERY.py).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pandas openpyxl xlrd pdfplumber
      - name: Run discovery
        env:
          PYTHONUNBUFFERED: "1"
          ROUND: "6"
        run: |
          mkdir -p pe_raw
          timeout 2100 python3 discovery_archive/south_america/PERU_GAS_DEMAND_DISCOVERY.py 2>&1 | tee pe_raw/log.txt
      - name: Push raw files to a throwaway branch for offline inspection
        if: always()
        run: |
          [ -d pe_raw ] || exit 0
          mv pe_raw /tmp/pe_raw
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan pe-gas-discovery-raw
          git rm -rfq --cached . >/dev/null
          git clean -fdxq
          mv /tmp/pe_raw pe_raw
          git add pe_raw
          git commit -qm "Peru gas discovery raw files (throwaway)"
          git push -f origin pe-gas-discovery-raw
