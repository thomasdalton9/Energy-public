name: Israel gov.il curl_cffi probe

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install curl_cffi
      - run: python3 discovery_archive/middle_east/ISRAEL_GOVIL_CURL_CFFI_PROBE.py
