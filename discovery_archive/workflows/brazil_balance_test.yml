name: Brazil balance test run

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pandas openpyxl pyarrow
      - name: Run
        run: |
          cd south_america
          python3 "ONS Brazil.py"
          echo "===CSV_START==="
          python3 -c "import pandas as pd; df = pd.ExcelFile('brazil_generation_daily.xlsx').parse('Regional balance'); df['date'] = pd.to_datetime(df['date']); df = df[df['date'] >= pd.Timestamp.today() - pd.Timedelta(days=730)]; df.to_csv('/dev/stdout', index=False)"
          echo "===CSV_END==="
