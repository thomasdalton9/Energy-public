name: West Africa other discovery 2

# Manual, one-off discovery (Cameroon, Eq. Guinea, Sierra Leone, Liberia,
# Gambia, Guinea-Bissau, Cape Verde). Output in run log + artifact; nothing committed.
on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Run discovery
        run: python3 discovery_archive/rest_of_world/WEST_AFRICA_OTHER_DISCOVERY2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: west-africa-other-output2
          path: west_africa_other_output2.txt
          if-no-files-found: ignore
