name: ENTSOG dropped points probe (manual)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python3 -u discovery_archive/europe/ENTSOG_DROPPED_POINTS_PROBE.py
