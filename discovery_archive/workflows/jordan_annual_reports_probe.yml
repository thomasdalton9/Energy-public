name: Jordan annual reports probe

on:
  workflow_dispatch:
    inputs:
      which:
        description: all / nepco / memr
        default: "all"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pdfplumber
      - name: Run probe
        run: timeout 5000 python3 discovery_archive/middle_east/JORDAN_ANNUAL_REPORTS_PROBE.py ${{ github.event.inputs.which }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe_out
          path: probe_out
          if-no-files-found: ignore
      - name: Commit text dump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f discovery_archive/results/jordan_annual || true
          git diff --cached --quiet && exit 0
          git commit -m "Jordan annual reports probe: text dump"
          for i in 1 2 3 4 5; do { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0; sleep $((i*5)); done
