name: Capacity EMA probe (manual)
on:
  workflow_dispatch:
    inputs:
      script:
        description: "probe script under discovery_archive/capacity_ema"
        default: "CAPACITY_EMA_PROBE1.py"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas openpyxl requests pdfplumber curl_cffi xlrd
      - run: sudo apt-get install -y unrar-free p7zip-full libarchive-tools >/dev/null 2>&1 || true
      - name: Probe
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 "discovery_archive/capacity_ema/${{ github.event.inputs.script }}"
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f discovery_archive/results/capacity_ema || true
          git diff --cached --quiet || git commit -m "Capacity EMA probe results"
          for i in 1 2 3; do { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0; sleep 5; done
