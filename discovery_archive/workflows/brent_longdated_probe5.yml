name: Brent curve sources probe 5
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests curl_cffi
      - env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: timeout 2200 python3 discovery_archive/brent/BRENT_LONGDATED_PROBE5.py
