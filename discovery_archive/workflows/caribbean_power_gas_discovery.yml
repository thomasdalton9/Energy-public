name: Caribbean power and gas discovery (PR JM DO)

# Manual-only probe runner for the Puerto Rico / Jamaica / Dominican Republic
# discovery scripts. Each entry of `targets` (JSON list) runs as its own job.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script path"
        default: "discovery_archive/south_america/CARIBBEAN_POWER_GAS_DISCOVERY.py"
      targets:
        description: "JSON list of arguments, one job each"
        default: '["eia","oc","dogas","jm","prlocal"]'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.event.inputs.targets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pandas openpyxl xlrd pdfplumber beautifulsoup4
      - name: Run probe
        env:
          PYTHONUNBUFFERED: "1"
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: timeout 1000 python3 "${{ github.event.inputs.script }}" ${{ matrix.target }}
