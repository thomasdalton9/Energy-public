name: Ireland ENTSOG discovery

on:
  workflow_dispatch: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests
      - name: Run discovery
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 540 python3 europe/IRELAND_ENTSOG_DISCOVERY.py
