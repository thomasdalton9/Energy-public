name: Jordan and Morocco JODI gas probe
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas lxml openpyxl matplotlib
      - name: JODI rows for Jordan and Morocco
        run: timeout 1200 python3 discovery_archive/middle_east/JORDAN_MOROCCO_JODI_PROBE.py
      - name: Egypt output identical before/after the shared-viewer refactor
        run: |
          git show b725108:middle_east/EGYPT_GAS.py > middle_east/EGYPT_GAS_ORIG.py
          timeout 900 python3 middle_east/EGYPT_GAS_ORIG.py --full --out /tmp/eg_orig.xlsx || true
          timeout 900 python3 middle_east/EGYPT_GAS.py --full --out /tmp/eg_new.xlsx || true
          python3 - <<'PY'
          import pandas as pd
          a = pd.read_excel("/tmp/eg_orig.xlsx", sheet_name=None); b = pd.read_excel("/tmp/eg_new.xlsx", sheet_name=None)
          print("sheets", list(a) == list(b), list(a))
          for k in a:
              if k in ("Releases",) or "Units" in k or "Notes" in k:
                  continue
              print(k, a[k].shape, b[k].shape, "IDENTICAL" if a[k].equals(b[k]) else "DIFFERENT")
          PY
