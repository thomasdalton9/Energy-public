name: China NBS audit probe 2

# Manual, one-off: full table dump of every NBS release by group + ID scan of the old archive (moved to discovery_archive/workflows after use).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [A, B, C]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas openpyxl
      - name: Dump
        run: timeout 3000 python3 discovery_archive/china/CHINA_NBS_AUDIT_PROBE2.py ${{ matrix.group }}
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f discovery_archive/results/china_nbs_audit
          git diff --cached --quiet || git commit -m "China NBS audit probe 2 dump ${{ matrix.group }}"
          for i in 1 2 3 4 5 6; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 7))
          done
          exit 1
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        range: ["1898200 1898800", "1898801 1899400", "1899401 1900000", "1900001 1900500", "1900501 1900960"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas
      - name: Scan
        run: timeout 4800 python3 discovery_archive/china/CHINA_NBS_AUDIT_PROBE3.py ${{ matrix.range }}
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f discovery_archive/results/china_nbs_audit
          git diff --cached --quiet || git commit -m "China NBS audit probe 2 idscan"
          for i in 1 2 3 4 5 6; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 7))
          done
          exit 1
