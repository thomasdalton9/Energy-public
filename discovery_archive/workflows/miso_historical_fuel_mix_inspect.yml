name: MISO historical fuel mix inspect

# Manual, one-off: found via the playwright discovery that MISO publishes a
# real per-year historical_gen_fuel_mix_<YEAR>.xlsx archive, no key needed.
# This checks which years exist and dumps their structure so a real
# backfill script can be written against it. See
# americas/MISO_HISTORICAL_FUEL_MIX_INSPECT.py's docstring. Output is in
# the run log and uploaded as an artifact - nothing committed.
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl requests

      - name: Run inspect
        run: python3 americas/MISO_HISTORICAL_FUEL_MIX_INSPECT.py

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miso-historical-fuel-mix-inspect-output
          path: americas/miso_historical_fuel_mix_inspect_output.txt
          if-no-files-found: ignore
