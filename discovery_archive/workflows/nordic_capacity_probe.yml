name: Nordic capacity probe (manual)
on:
  workflow_dispatch:
    inputs:
      script:
        description: probe script name in discovery_archive/europe/capacity
        default: NORDIC_CAPACITY_PROBE6.py
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas openpyxl requests xlrd lxml curl_cffi pymupdf
      - name: Run probe
        env:
          PYTHONUNBUFFERED: "1"
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: |
          mkdir -p discovery_archive/results/europe_capacity
          python3 "discovery_archive/europe/capacity/${{ inputs.script }}" 2>&1 | tee "discovery_archive/results/europe_capacity/nordic_${{ inputs.script }}.log"
      - name: Commit log
        if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f discovery_archive/results/europe_capacity
          git diff --cached --quiet || git commit -m "Nordic capacity probe log"
          for i in 1 2 3 4 5; do { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0; sleep $((i*5)); done
