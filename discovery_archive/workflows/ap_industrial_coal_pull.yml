name: AP industrial coal pull (manual)

# One-off: UN energy balances/statistics and monthly fuel prices for the Asia-Pacific industrial coal-to-LNG study.
# Commits CSVs to discovery_archive/rest_of_world/data/ (run 2026-10-03; last run used AP_INDUSTRIAL_COAL_PULL2.py).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -q pandas requests openpyxl lxml
      - name: Pull
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 1600 python3 discovery_archive/rest_of_world/AP_INDUSTRIAL_COAL_PULL2.py
      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f discovery_archive/rest_of_world/data/*.csv || true
          git diff --cached --quiet && { echo "Nothing to commit."; exit 0; }
          git commit -m "AP industrial coal study: UN energy data and fuel prices (one-off pull)"
          for i in 1 2 3 4 5; do
            { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
