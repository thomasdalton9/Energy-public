name: Bolivia CNDC Playwright discovery

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run probe
        run: timeout 300 python3 south_america/BOLIVIA_CNDC_PLAYWRIGHT_DISCOVERY.py
