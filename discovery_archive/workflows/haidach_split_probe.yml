name: Haidach split probe (manual)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas
      - run: python3 -u discovery_archive/europe/AGGM_STORAGE_FACILITY_PROBE.py > aggm.log 2>&1; cat aggm.log | cut -c1-200 | head -150
