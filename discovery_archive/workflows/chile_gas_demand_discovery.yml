name: Chile gas demand discovery

# Runs one of the CHILE_GAS_DEMAND_DISCOVERY*.py probes (manual only).
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Probe script in discovery_archive/south_america/"
        default: "CHILE_GAS_DEMAND_DISCOVERY.py"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pdfplumber pandas openpyxl xlrd
      - name: Run discovery
        env:
          PYTHONUNBUFFERED: "1"
          SCRIPT: ${{ inputs.script }}
        run: timeout 1700 python3 "discovery_archive/south_america/$(basename "$SCRIPT")"
