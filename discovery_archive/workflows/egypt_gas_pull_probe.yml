name: Egypt gas pull probe
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas lxml
      - run: timeout 1500 python3 discovery_archive/middle_east/EGYPT_GAS_PULL_PROBE.py
