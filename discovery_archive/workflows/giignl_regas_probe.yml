name: GIIGNL regas probe (manual)

# One-off (run 2026-10-03): GIIGNL Annual Report 2025 has LNG imports by country on page 16 and the per-terminal
# regasification table (pages 52-62) with each market total printed as "<n> MTPA" under the market name.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -q pandas openpyxl requests pdfplumber
      - name: Run probe
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 800 python3 discovery_archive/rest_of_world/GIIGNL_REGAS_PROBE.py
