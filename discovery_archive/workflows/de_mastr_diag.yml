name: DE MaStR diagnostics (manual)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas openpyxl requests
      - name: Run probe
        run: |
          mkdir -p discovery_archive/results/europe_capacity/de_nl_be_lu
          python3 -u discovery_archive/europe/capacity/DE_MASTR_DIAG.py 2>&1 | tee discovery_archive/results/europe_capacity/de_nl_be_lu/de_mastr_diag.txt
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f discovery_archive/results/europe_capacity/de_nl_be_lu/
          git diff --cached --quiet || git commit -m "DE MaStR diagnostics result"
          for i in 1 2 3 4 5; do { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0; sleep $((i*5)); done
