name: Future gas infrastructure probe (manual)
on:
  workflow_dispatch:
    inputs:
      script: {description: "probe script name", default: "GAS_INFRA_PROBE1.py"}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas openpyxl requests beautifulsoup4 lxml pdfplumber curl_cffi
      - name: Run probe
        env:
          GIE_API_KEY: ${{ secrets.GIE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python3 discovery_archive/future_capacity/${{ github.event.inputs.script }}
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f discovery_archive/results/future_capacity || true
          git diff --cached --quiet || git commit -m "Future gas infrastructure probe results"
          for i in 1 2 3; do { git pull --rebase --autostash -X theirs || git rebase --abort; } && git push && exit 0; sleep 5; done
