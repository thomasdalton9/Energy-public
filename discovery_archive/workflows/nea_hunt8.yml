name: NEA hunt 8

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Run probe
        run: |
          mkdir -p discovery_archive/results/nea
          timeout 800 python3 discovery_archive/nea/NEA_HUNT8.py 2>&1 | tee discovery_archive/results/nea/hunt8.txt | tail -5
      - name: Commit result
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add discovery_archive/results/nea
          git commit -m "NEA hunt 8 result" || exit 0
          for i in 1 2 3; do git pull --rebase origin main -q; git push origin HEAD:main && break; sleep 5; done
