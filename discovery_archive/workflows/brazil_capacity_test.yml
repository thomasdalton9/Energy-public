name: Brazil capacity test run

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pandas openpyxl
      - name: Run
        run: |
          cd south_america
          python3 BRAZIL_ANEEL_CAPACITY.py --out /tmp/brazil_capacity.xlsx
          echo "--- sheets ---"
          python3 -c "import pandas as pd; xl = pd.ExcelFile('/tmp/brazil_capacity.xlsx'); print(xl.sheet_names); [print('=== ' + n + ' ===\n' + xl.parse(n).head(20).to_string()) for n in ['By state and fuel', 'By fuel (national)']]"
