name: North Central America power discovery (GT SV HN BZ EOR)

# Manual-only probe runner for the AMM / UT / ODS / BEL / EOR discovery
# scripts. Each entry of `targets` (JSON list) runs as its own job so the
# logs stay readable.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script path"
        default: "discovery_archive/south_america/NORTH_CENTRAL_AMERICA_POWER_DISCOVERY.py"
      targets:
        description: "JSON list of arguments, one job each"
        default: '["amm","ut","ods","bel","eor"]'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.event.inputs.targets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pandas openpyxl xlrd pdfplumber beautifulsoup4
      - name: Run probe
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 1000 python3 "${{ github.event.inputs.script }}" ${{ matrix.target }}
