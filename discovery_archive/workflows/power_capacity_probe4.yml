name: Power capacity probe 4

# Manual-only: round-4 capacity probe (Argentina SE potencia-instalada.csv and CAMMESA Potencia Instalada.xlsx).
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests openpyxl certifi pyarrow xlrd
      - name: Probe
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 1300 python3 discovery_archive/south_america/POWER_CAPACITY_PROBE4.py
