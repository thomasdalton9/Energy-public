name: South & Southeast Asia discovery

# One-off source probes for the South & Southeast Asia master. Runs the scripts
# listed in discovery_archive/asia/SEA_RUN.txt on every push that changes them.
# Moves to discovery_archive/workflows/ once the probes are done.
on:
  push:
    branches: [claude/compassionate-darwin-2khdxe]
    paths:
      - "discovery_archive/asia/SEA_*"
      - "discovery_archive/subcontinent/SEA_*"
      - ".github/workflows/sea_discovery.yml"
  workflow_dispatch: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pandas openpyxl xlrd pdfplumber
      - name: Run probes
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          cd discovery_archive/asia
          grep -v '^#' SEA_RUN.txt | while read -r line; do
            [ -z "$line" ] && continue
            echo "################ $line"
            timeout 900 python3 $line || echo "!! exit $?"
          done
