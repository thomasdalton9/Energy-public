name: Europe pipeline probe (manual)
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Probe script in discovery_archive/future_capacity"
        default: "EUROPE_PIPELINE_PROBE1.py"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas openpyxl requests pdfplumber xlrd lxml
      - run: python3 -u "discovery_archive/future_capacity/${{ github.event.inputs.script }}"
        env:
          PYTHONUNBUFFERED: "1"
