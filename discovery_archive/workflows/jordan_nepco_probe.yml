name: Jordan NEPCO probe

on:
  workflow_dispatch:
    inputs:
      round:
        description: probe round
        default: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install requests curl_cffi pdfplumber pypdf openpyxl pandas lxml playwright
          playwright install --with-deps chromium
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-ara >/dev/null
      - name: Run probe
        run: timeout 3900 python3 discovery_archive/middle_east/JORDAN_NEPCO_PROBE.py ${{ github.event.inputs.round }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe_out
          path: probe_out
          if-no-files-found: ignore
