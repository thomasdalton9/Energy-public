name: ENTSOG border rule probe (manual)

on:
  workflow_dispatch:
    inputs:
      pairs:
        description: 'country pairs, e.g. BG-GR,BG-TR'
        default: 'BG-GR,BG-TR,BG-RO,BG-RS,BG-MK'
      start:
        default: '2024-07-01'
      end:
        default: '2024-07-31'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas openpyxl
      - run: python3 -u discovery_archive/europe/ENTSOG_RULE_PROBE.py ${{ github.event.inputs.start }} ${{ github.event.inputs.end }}
        env:
          PAIRS: ${{ github.event.inputs.pairs }}
