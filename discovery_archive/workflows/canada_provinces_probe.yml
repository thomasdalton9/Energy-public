name: Canada provinces probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas xlrd openpyxl
      - run: timeout 700 python3 discovery_archive/CANADA_PROVINCES_PROBE.py
