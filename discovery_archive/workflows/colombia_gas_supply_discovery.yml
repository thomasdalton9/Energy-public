name: Colombia gas supply discovery

on:
  workflow_dispatch:
    inputs:
      reports:
        description: "Space-separated report PDF URLs (blank = defaults)"
        type: string
        default: ""

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pdfplumber pandas openpyxl
      - name: Run discovery
        env:
          PYTHONUNBUFFERED: "1"
          ROUND: "2"
        run: timeout 800 python3 discovery_archive/COLOMBIA_GAS_SUPPLY_DISCOVERY.py ${{ inputs.reports }}
