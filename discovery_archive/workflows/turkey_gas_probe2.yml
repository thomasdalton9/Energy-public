name: Turkey gas probe 2 (manual)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install curl_cffi openpyxl pypdf
      - run: timeout 400 python3 discovery_archive/turkey/TURKEY_GAS_PROBE2.py | tee discovery_archive/results/turkey/probe2_log.txt
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f discovery_archive/results/turkey
          git commit -m "Turkey gas probe results" || exit 0
          git pull --rebase --autostash -X theirs origin main && git push
