name: MISO historical fuel mix discovery

# Manual, one-off: looks for a way to pull MISO's *historical* generation-
# by-fuel-type data (not just Today/Yesterday from the real-time API) for a
# one-time backfill. See
# americas/MISO_HISTORICAL_FUEL_MIX_DISCOVERY.py's docstring. Output is in
# the run log and uploaded as an artifact - nothing is committed.
on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run discovery
        run: python3 americas/MISO_HISTORICAL_FUEL_MIX_DISCOVERY.py

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miso-historical-fuel-mix-discovery-output
          path: americas/miso_historical_fuel_mix_discovery_output.txt
          if-no-files-found: ignore
