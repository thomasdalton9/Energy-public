name: AU gas hub archive probe (manual)

# One-off (run 2026-10-03): how far back AEMO's DWGM and Wallumbilla folders reach. Result: VicGas keeps 31
# PublicRptsNN.zip daily snapshots, each with a 14-day INT041 (about 6 weeks in all); every Wallumbilla benchmark
# file holds the full history from 2014-03-19.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -q requests pandas openpyxl
      - name: Run probe
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 1100 python3 discovery_archive/rest_of_world/AU_GAS_HUB_ARCHIVE_PROBE.py
