name: GIIGNL older format inspect

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pdfplumber

      - name: Run probe
        run: timeout 300 python3 americas/GIIGNL_OLDER_FORMAT_INSPECT.py
