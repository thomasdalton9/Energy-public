name: Ireland GNI resources inspect

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests
      - name: Run inspect
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 480 python3 europe/IRELAND_GNI_RESOURCES_INSPECT.py
