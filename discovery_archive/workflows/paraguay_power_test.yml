name: Paraguay power test

# Manual test of PARAGUAY_POWER.py: writes to the runner's temp dir, commits nothing.
on:
  workflow_dispatch:
    inputs:
      budget_min:
        description: "CAMMESA fetch budget (minutes)"
        required: false
        default: "6"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get install -y -q mdbtools >/dev/null
          pip install pandas requests openpyxl pyarrow pdfplumber certifi
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          timeout 3000 python3 south_america/PARAGUAY_POWER.py --out /tmp/py/paraguay_power_generation_daily.xlsx --budget-min "${{ github.event.inputs.budget_min }}"
          python3 add_charts.py /tmp/py/paraguay_power_generation_daily.xlsx || true
          python3 -c "
          import pandas as pd
          x = pd.ExcelFile('/tmp/py/paraguay_power_generation_daily.xlsx'); print(x.sheet_names)
          for s in ['Full plants', 'Yacyreta EBY reports', 'BEN annual', 'Yacyreta eby.org.ar']:
              try:
                  d = pd.read_excel(x, sheet_name=s); print('==', s, d.shape); print(d.to_string(max_rows=90, max_colwidth=60))
              except Exception as e: print(s, e)
          "
