name: AU residential gas discovery

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pandas openpyxl xlrd
      - name: Run probe
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 1000 python3 discovery_archive/australia_nz/AU_RESI_DISCOVERY.py
