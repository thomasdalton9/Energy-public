name: DE NL BE LU capacity probe 7 (manual)
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests openpyxl
      - run: python3 -u discovery_archive/europe/capacity/DE_NL_BE_LU_CAPACITY_PROBE7.py
