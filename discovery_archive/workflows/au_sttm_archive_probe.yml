name: AU STTM archive probe (manual)

# One-off (run 2026-10-03): does AEMO keep INT651 STTM price history? Result: no ARCHIVE/STTM folder (404),
# but CURRENT/STTM keeps 31 DayNN.zip daily snapshots, each with a 7-day INT651 report (about 5 weeks in all).
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: discovery_archive/rest_of_world
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -q requests pandas
      - name: Run probe
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 1100 python3 discovery_archive/rest_of_world/AU_STTM_ARCHIVE_PROBE.py
