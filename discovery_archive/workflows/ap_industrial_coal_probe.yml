name: AP industrial coal probe (manual)

# One-off (run 2026-10-03): sources for coal use by industry subsector in Asia-Pacific. Result: UNSD SDMX energy
# balances (data.un.org/legacy/ws/rest, DF_UNData_EnergyBalance) work keyless; EGEDA balance.php returns HTTP 500.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -q pandas openpyxl xlrd requests pdfplumber
      - name: Run probe
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 1100 python3 discovery_archive/rest_of_world/AP_INDUSTRIAL_COAL_PROBE.py
